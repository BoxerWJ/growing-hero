<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리들의 성장 모험</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 12px;
      background: #edf6ff;
      font-family: sans-serif;
      text-align: center;
      color: #243449;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 26px;
    }

    .game {
      max-width: 800px;
      margin: auto;
      overflow: hidden;
      border: 4px solid #394b60;
      border-radius: 16px;
      background: white;
    }

    .status {
      padding: 16px;
      background: #fff8df;
      font-size: 18px;
      font-weight: bold;
    }

    .scene {
      position: relative;
      height: 360px;
      overflow: hidden;
      background: linear-gradient(#8dd7ff, #e4f7ff);
    }

    .sun {
      position: absolute;
      top: 30px;
      right: 40px;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #ffe17b;
    }

    .cloud {
      position: absolute;
      top: 55px;
      left: 10%;
      width: 130px;
      height: 40px;
      border-radius: 50px;
      background: white;
    }

    .hill {
      position: absolute;
      bottom: 60px;
      left: -10%;
      width: 80%;
      height: 150px;
      border-radius: 50% 50% 0 0;
      background: #91cf9b;
    }

    .ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 70px;
      border-top: 12px solid #67b74c;
      background: #b68659;
    }

    /* 새 캐릭터 그림 */
    .hero {
      position: absolute;
      bottom: 70px;
      left: calc(50% - 60px);
      width: 120px;
      height: 180px;
      object-fit: contain;
      z-index: 2;
    }

    .info {
      padding: 16px;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <h1>🌱 우리들의 성장 모험</h1>

  <main class="game">
    <div class="status">
      레벨 1 · 경험치 0 / 10
    </div>

    <div class="scene">
      <div class="sun"></div>
      <div class="cloud"></div>
      <div class="hill"></div>
      <div class="ground"></div>

      <!-- 검은 머리, 검은 단추 옷, 청바지, 무기 없음 -->
      <img
        class="hero"
        src="./hero.png"
        alt="검은 단추 옷과 청바지를 입은 레벨 1 모험가"
      >
    </div>

    <div class="info">
      오늘부터 모험 시작!<br>
      장비: 검은 단추 옷 · 청바지<br>
      무기: 없음
    </div>
  </main>
</body>
</html>
