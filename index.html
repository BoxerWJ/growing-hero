<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리들의 성장 모험</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 12px;
      background: #edf6ff;
      font-family: sans-serif;
      text-align: center;
      color: #243449;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 26px;
    }

    .game {
      max-width: 800px;
      margin: auto;
      overflow: hidden;
      border: 4px solid #394b60;
      border-radius: 16px;
      background: white;
    }

    .status {
      padding: 16px;
      background: #fff8df;
      font-size: 18px;
      font-weight: bold;
    }

    .scene {
      position: relative;
      height: 360px;
      overflow: hidden;
      background: linear-gradient(#8dd7ff, #e4f7ff);
    }

    .sun {
      position: absolute;
      top: 30px;
      right: 40px;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #ffe17b;
    }

    .cloud {
      position: absolute;
      top: 55px;
      left: 10%;
      width: 130px;
      height: 40px;
      border-radius: 50px;
      background: white;
    }

    .hill {
      position: absolute;
      bottom: 60px;
      left: -10%;
      width: 80%;
      height: 150px;
      border-radius: 50% 50% 0 0;
      background: #91cf9b;
    }

    .ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 70px;
      border-top: 12px solid #67b74c;
      background: #b68659;
    }

    /* 레벨 1 캐릭터 */
    .hero {
      position: absolute;
      bottom: 70px;
      left: 0;
      width: 120px;
      height: 180px;
      object-fit: contain;
      z-index: 2;
      user-select: none;
      pointer-events: none;
    }

    /* 첫 번째 몬스터: 초록 슬라임 */
    .slime {
      position: absolute;
      bottom: 70px;
      left: 75%;
      width: 64px;
      height: 48px;
      border: 3px solid #287b39;
      border-radius: 50% 50% 30% 30%;
      background: #7de36b;
      z-index: 1;
      transform-origin: center bottom;
      animation: slimeBounce 1s ease-in-out infinite;
    }

    .slime-eye {
      position: absolute;
      top: 20px;
      width: 6px;
      height: 9px;
      border-radius: 50%;
      background: #243449;
    }

    .slime-eye.left {
      left: 15px;
    }

    .slime-eye.right {
      right: 15px;
    }

    .slime-mouth {
      position: absolute;
      top: 31px;
      left: 25px;
      width: 8px;
      height: 5px;
      border-bottom: 2px solid #243449;
      border-radius: 50%;
    }

    @keyframes slimeBounce {
      0%, 100% {
        transform: scale(1.05, 0.92);
      }

      50% {
        transform: scale(0.95, 1.08);
      }
    }

    .info {
      padding: 16px;
      line-height: 1.8;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 0 12px 20px;
    }

    .control-button {
      width: 76px;
      height: 56px;
      border: 0;
      border-radius: 12px;
      background: #365f96;
      color: white;
      font-size: 26px;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .control-button:active {
      background: #23416a;
    }

    .jump-button {
      background: #95602f;
      font-size: 18px;
    }

    .jump-button:active {
      background: #70451f;
    }
  </style>
</head>

<body>
  <h1>🌱 우리들의 성장 모험</h1>

  <main class="game">
    <div class="status">
      레벨 1 · 경험치 0 / 10
    </div>

    <div class="scene" id="scene">
      <div class="sun"></div>
      <div class="cloud"></div>
      <div class="hill"></div>
      <div class="ground"></div>

      <!-- 초록 슬라임 -->
      <div
        class="slime"
        id="slime"
        role="img"
        aria-label="초록 슬라임"
      >
        <div class="slime-eye left"></div>
        <div class="slime-eye right"></div>
        <div class="slime-mouth"></div>
      </div>

      <!-- 검은 머리, 검은 단추 옷, 청바지, 무기 없음 -->
      <img
        class="hero"
        id="hero"
        src="./hero.png"
        alt="검은 단추 옷과 청바지를 입은 레벨 1 모험가"
        draggable="false"
      >
    </div>

    <div class="info">
      ← → 이동 · 스페이스바 점프<br>
      휴대폰에서는 이동과 점프를 동시에 눌러 봐!<br>
      장비: 검은 단추 옷 · 청바지<br>
      무기: 없음
    </div>

    <div class="controls">
      <button
        class="control-button"
        id="leftButton"
        type="button"
        aria-label="왼쪽으로 이동"
      >←</button>

      <button
        class="control-button"
        id="rightButton"
        type="button"
        aria-label="오른쪽으로 이동"
      >→</button>

      <button
        class="control-button jump-button"
        id="jumpButton"
        type="button"
      >점프</button>
    </div>
  </main>

  <script>
    const scene = document.getElementById("scene");
    const hero = document.getElementById("hero");
    const slime = document.getElementById("slime");

    const leftButton = document.getElementById("leftButton");
    const rightButton = document.getElementById("rightButton");
    const jumpButton = document.getElementById("jumpButton");

    // 캐릭터의 가로 위치
    let heroX = Math.max(
      0,
      (scene.clientWidth - hero.offsetWidth) / 2
    );

    // 땅에서 올라온 높이
    let heroY = 0;

    // 위아래로 움직이는 속도
    let verticalSpeed = 0;

    const moveSpeed = 220;
    const jumpPower = 520;
    const gravity = 1500;

    let previousTime = null;

    // 키보드 입력 상태
    const keys = {
      left: false,
      right: false
    };

    // 손가락마다 입력을 따로 기억
    const touches = {
      left: new Set(),
      right: new Set()
    };

    function drawHero() {
      hero.style.left = heroX + "px";
      hero.style.bottom = (70 + heroY) + "px";
    }

    function jump() {
      // 땅에 있을 때만 점프
      if (heroY === 0 && verticalSpeed === 0) {
        verticalSpeed = jumpPower;
      }
    }

    // 키보드 입력
    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        keys.left = true;
      }

      if (event.key === "ArrowRight") {
        event.preventDefault();
        keys.right = true;
      }

      if (event.code === "Space") {
        event.preventDefault();

        if (!event.repeat) {
          jump();
        }
      }
    });

    window.addEventListener("keyup", (event) => {
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        keys.left = false;
      }

      if (event.key === "ArrowRight") {
        event.preventDefault();
        keys.right = false;
      }

      if (event.code === "Space") {
        event.preventDefault();
      }
    });

    // 이동 버튼의 멀티터치 처리
    function setupMoveButton(button, direction) {
      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();

        button.setPointerCapture(event.pointerId);
        touches[direction].add(event.pointerId);
      });

      function releasePointer(event) {
        touches[direction].delete(event.pointerId);
      }

      button.addEventListener("pointerup", releasePointer);
      button.addEventListener("pointercancel", releasePointer);
      button.addEventListener("lostpointercapture", releasePointer);
    }

    setupMoveButton(leftButton, "left");
    setupMoveButton(rightButton, "right");

    // 다른 손가락으로 이동 중이어도 즉시 점프
    jumpButton.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      jump();
    });

    // 키보드로 점프 버튼을 선택해서 누를 때
    jumpButton.addEventListener("click", (event) => {
      if (event.detail === 0) {
        jump();
      }
    });

    // 버튼을 길게 눌렀을 때 메뉴가 나오지 않도록 처리
    document.querySelectorAll(".control-button").forEach((button) => {
      button.addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });
    });

    function stopMoving() {
      keys.left = false;
      keys.right = false;

      touches.left.clear();
      touches.right.clear();
    }

    // 다른 창으로 이동하면 이동 입력 초기화
    window.addEventListener("blur", stopMoving);

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopMoving();
      }

      previousTime = null;
    });

    // 캐릭터가 화면 밖으로 나가지 않도록 제한
    function keepInsideScene() {
      const maxX = Math.max(
        0,
        scene.clientWidth - hero.offsetWidth
      );

      heroX = Math.max(0, Math.min(heroX, maxX));
    }

    // 작은 화면에서도 슬라임이 잘리지 않도록 배치
    function positionSlime() {
      const maxX = Math.max(
        0,
        scene.clientWidth - slime.offsetWidth - 8
      );

      const slimeX = Math.max(
        0,
        Math.min(scene.clientWidth * 0.75, maxX)
      );

      slime.style.left = slimeX + "px";
    }

    window.addEventListener("resize", () => {
      keepInsideScene();
      positionSlime();
      drawHero();
    });

    function gameLoop(currentTime) {
      if (previousTime === null) {
        previousTime = currentTime;
      }

      const deltaTime = Math.min(
        (currentTime - previousTime) / 1000,
        0.05
      );

      previousTime = currentTime;

      const movingLeft =
        keys.left || touches.left.size > 0;

      const movingRight =
        keys.right || touches.right.size > 0;

      const direction =
        Number(movingRight) - Number(movingLeft);

      // 좌우 이동
      heroX += direction * moveSpeed * deltaTime;

      // 이동 방향으로 바라보기
      if (direction < 0) {
        hero.style.transform = "scaleX(-1)";
      } else if (direction > 0) {
        hero.style.transform = "scaleX(1)";
      }

      // 점프 중에는 중력 때문에 아래로 떨어짐
      if (heroY > 0 || verticalSpeed > 0) {
        heroY +=
          verticalSpeed * deltaTime
          - 0.5 * gravity * deltaTime * deltaTime;

        verticalSpeed -= gravity * deltaTime;

        // 땅에 착지
        if (heroY <= 0) {
          heroY = 0;
          verticalSpeed = 0;
        }
      }

      keepInsideScene();
      drawHero();

      requestAnimationFrame(gameLoop);
    }

    positionSlime();
    drawHero();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
