<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리들의 성장 모험</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 12px;
      background: #edf6ff;
      font-family: sans-serif;
      text-align: center;
      color: #243449;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 26px;
    }

    .game {
      max-width: 800px;
      margin: auto;
      overflow: hidden;
      border: 4px solid #394b60;
      border-radius: 16px;
      background: white;
    }

    .status {
      padding: 16px;
      background: #fff8df;
      font-size: 18px;
      font-weight: bold;
    }

    .scene {
      position: relative;
      height: 360px;
      overflow: hidden;
      background: linear-gradient(#8dd7ff, #e4f7ff);
    }

    .sun {
      position: absolute;
      top: 30px;
      right: 40px;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #ffe17b;
    }

    .cloud {
      position: absolute;
      top: 55px;
      left: 10%;
      width: 130px;
      height: 40px;
      border-radius: 50px;
      background: white;
    }

    .hill {
      position: absolute;
      bottom: 60px;
      left: -10%;
      width: 80%;
      height: 150px;
      border-radius: 50% 50% 0 0;
      background: #91cf9b;
    }

    .ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 70px;
      border-top: 12px solid #67b74c;
      background: #b68659;
    }

    .hero {
      position: absolute;
      bottom: 70px;
      left: 0;
      width: 120px;
      height: 180px;
      object-fit: contain;
      z-index: 2;
      user-select: none;
      pointer-events: none;
    }

    .info {
      padding: 16px;
      line-height: 1.8;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 0 12px 20px;
    }

    .control-button {
      width: 76px;
      height: 56px;
      border: 0;
      border-radius: 12px;
      background: #365f96;
      color: white;
      font-size: 26px;
      cursor: pointer;
      touch-action: none;
      user-select: none;
    }

    .control-button:active {
      background: #23416a;
    }

    .jump-button {
      background: #95602f;
      font-size: 18px;
    }

    .jump-button:active {
      background: #70451f;
    }
  </style>
</head>

<body>
  <h1>🌱 우리들의 성장 모험</h1>

  <main class="game">
    <div class="status">
      레벨 1 · 경험치 0 / 10
    </div>

    <div class="scene" id="scene">
      <div class="sun"></div>
      <div class="cloud"></div>
      <div class="hill"></div>
      <div class="ground"></div>

      <img
        class="hero"
        id="hero"
        src="./hero.png"
        alt="검은 단추 옷과 청바지를 입은 레벨 1 모험가"
        draggable="false"
      >
    </div>

    <div class="info">
      ← → 이동 · 스페이스바 점프<br>
      장비: 검은 단추 옷 · 청바지<br>
      무기: 없음
    </div>

    <div class="controls">
      <button class="control-button" id="leftButton"
        type="button" aria-label="왼쪽으로 이동">←</button>

      <button class="control-button" id="rightButton"
        type="button" aria-label="오른쪽으로 이동">→</button>

      <button class="control-button jump-button" id="jumpButton"
        type="button">점프</button>
    </div>
  </main>

  <script>
    const scene = document.getElementById("scene");
    const hero = document.getElementById("hero");
    const leftButton = document.getElementById("leftButton");
    const rightButton = document.getElementById("rightButton");
    const jumpButton = document.getElementById("jumpButton");

    let heroX = Math.max(
      0,
      (scene.clientWidth - hero.offsetWidth) / 2
    );

    // 땅에서 얼마나 높이 올라왔는지
    let heroY = 0;

    // 위아래로 움직이는 속도
    let verticalSpeed = 0;

    const moveSpeed = 220;
    const jumpPower = 520;
    const gravity = 1500;

    const keys = {
      left: false,
      right: false
    };

    const touches = {
      left: new Set(),
      right: new Set()
    };

    function drawHero() {
      hero.style.left = heroX + "px";
      hero.style.bottom = (70 + heroY) + "px";
    }

    function jump() {
      // 땅에 있을 때만 점프 가능
      if (heroY === 0) {
        verticalSpeed = jumpPower;
      }
    }

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        keys.left = true;
      }

      if (event.key === "ArrowRight") {
        event.preventDefault();
        keys.right = true;
      }

      if (event.code === "Space") {
        event.preventDefault();

        // 계속 누르고 있어도 한 번만 점프
        if (!event.repeat) {
          jump();
        }
      }
    });

    window.addEventListener("keyup", (event) => {
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        keys.left = false;
      }

      if (event.key === "ArrowRight") {
        event.preventDefault();
        keys.right = false;
      }

      if (event.code === "Space") {
        event.preventDefault();
      }
    });

    function setupMoveButton(button, direction) {
      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        touches[direction].add(event.pointerId);
      });

      function releasePointer(event) {
        touches[direction].delete(event.pointerId);
      }

      button.addEventListener("pointerup", releasePointer);
      button.addEventListener("pointercancel", releasePointer);
      button.addEventListener("lostpointercapture", releasePointer);
    }

    setupMoveButton(leftButton, "left");
    setupMoveButton(rightButton, "right");

    // 클릭과 터치, 키보드로 점프 버튼 사용
    jumpButton.addEventListener("click", jump);

    document.querySelectorAll(".control-button").forEach((button) => {
      button.addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });
    });

    function stopMoving() {
      keys.left = false;
      keys.right = false;
      touches.left.clear();
      touches.right.clear();
    }

    window.addEventListener("blur", stopMoving);

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopMoving();
      }

      previousTime = null;
    });

    function keepInsideScene() {
      const maxX = Math.max(
        0,
        scene.clientWidth - hero.offsetWidth
      );

      heroX = Math.max(0, Math.min(heroX, maxX));
    }

    window.addEventListener("resize", () => {
      keepInsideScene();
      drawHero();
    });

    let previousTime = null;

    function gameLoop(currentTime) {
      if (previousTime === null) {
        previousTime = currentTime;
      }

      const deltaTime = Math.min(
        (currentTime - previousTime) / 1000,
        0.05
      );

      previousTime = currentTime;

      const movingLeft = keys.left || touches.left.size > 0;
      const movingRight = keys.right || touches.right.size > 0;

      const direction =
        Number(movingRight) - Number(movingLeft);

      heroX += direction * moveSpeed * deltaTime;

      if (direction < 0) {
        hero.style.transform = "scaleX(-1)";
      } else if (direction > 0) {
        hero.style.transform = "scaleX(1)";
      }

      // ジャンプ中は重力で少しずつ下向きに加速
      if (heroY > 0 || verticalSpeed > 0) {
        heroY += verticalSpeed * deltaTime
          - 0.5 * gravity * deltaTime * deltaTime;

        verticalSpeed -= gravity * deltaTime;

        // 地面に着地
        if (heroY <= 0) {
          heroY = 0;
          verticalSpeed = 0;
        }
      }

      keepInsideScene();
      drawHero();
      requestAnimationFrame(gameLoop);
    }

    drawHero();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
