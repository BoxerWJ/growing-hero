<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>우리의 성장 게임</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background: #edf6ff;
      color: #243349;
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      margin: 8px 0 14px;
      font-size: 25px;
    }

    #game {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 390px;
      margin: 0 auto;
      overflow: hidden;
      border: 4px solid #34475e;
      border-radius: 16px;
      background: linear-gradient(#a9e2ff, #effbff);
    }

    #status {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 5;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
      text-align: left;
      font-weight: bold;
      line-height: 1.6;
    }

    #message {
      position: absolute;
      top: 100px;
      left: 0;
      width: 100%;
      padding: 0 12px;
      font-weight: bold;
      color: #36536e;
    }

    #ground {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 60px;
      border-top: 10px solid #75bc55;
      background: #b88755;
    }

    /* 주인공의 위치와 방향을 담당하는 상자 */
    #hero {
      position: absolute;
      bottom: 60px;
      left: 0;
      width: 90px;
      height: 110px;
      z-index: 3;
      pointer-events: none;
    }

    /* 두 그림을 같은 자리에 겹쳐 놓음 */
    .heroImage {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-origin: 50% 90%;
      user-select: none;
      -webkit-user-drag: none;
    }

    #heroPunch {
      visibility: hidden;
    }

    /* 공격 2일 때 주먹 지르는 그림만 보여 줌 */
    #hero.punching #heroIdle {
      visibility: hidden;
    }

    #hero.punching #heroPunch {
      visibility: visible;
    }

    /* 공격 1: 몸을 앞으로 내미는 동작 */
    #heroIdle.attackOne {
      animation: heroAttackOne 280ms ease-out;
    }

    @keyframes heroAttackOne {
      0% {
        transform: translateX(0) rotate(0deg);
      }

      20% {
        transform: translateX(-8px) rotate(-10deg);
      }

      45% {
        transform: translateX(23px) rotate(15deg)
                   scale(1.07, 0.95);
      }

      65% {
        transform: translateX(17px) rotate(9deg);
      }

      100% {
        transform: translateX(0) rotate(0deg);
      }
    }

    /* 공격 2: 새 그림으로 앞으로 짧게 치고 돌아옴 */
    #heroPunch.attackTwo {
      animation: heroAttackTwo 320ms ease-out;
    }

    @keyframes heroAttackTwo {
      0% {
        transform: translateX(-6px) rotate(-4deg);
      }

      35% {
        transform: translateX(18px) rotate(3deg);
      }

      60% {
        transform: translateX(18px) rotate(3deg);
      }

      100% {
        transform: translateX(0) rotate(0deg);
      }
    }

    /* 슬라임의 위치를 담당 */
    #slime {
      position: absolute;
      bottom: 60px;
      width: 68px;
      height: 54px;
      z-index: 2;
    }

    #slimeBody {
      position: relative;
      width: 100%;
      height: 100%;
      border: 3px solid #329343;
      border-radius: 50% 50% 35% 35%;
      background: #7be36b;
      transform-origin: center bottom;
      animation: squish 0.85s infinite alternate ease-in-out;
    }

    /* 슬라임의 두 눈 */
    #slimeBody::before,
    #slimeBody::after {
      content: "";
      position: absolute;
      top: 20px;
      width: 7px;
      height: 10px;
      border-radius: 50%;
      background: #203329;
    }

    #slimeBody::before {
      left: 19px;
    }

    #slimeBody::after {
      right: 19px;
    }

    #slimeBody.hit {
      animation: slimeHit 260ms ease-out;
    }

    @keyframes slimeHit {
      0% {
        filter: brightness(4);
        transform: scale(1.3, 0.65);
      }

      40% {
        filter: brightness(2);
        transform: scale(0.85, 1.15);
      }

      100% {
        filter: brightness(1);
        transform: scale(1, 1);
      }
    }

    @keyframes squish {
      from {
        transform: scale(1.05, 0.92);
      }

      to {
        transform: scale(0.95, 1.08);
      }
    }

    #slimeHealth {
      position: absolute;
      bottom: 125px;
      width: 68px;
      height: 9px;
      overflow: hidden;
      border: 2px solid white;
      border-radius: 8px;
      background: #56616c;
    }

    #slimeHealthFill {
      width: 100%;
      height: 100%;
      background: #ff6576;
    }

    #effects {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    /* 타격 순간 나타나는 별 모양 */
    .hitSpark {
      position: absolute;
      width: 58px;
      height: 58px;
      background: #fff4a6;
      clip-path: polygon(
        50% 0%, 61% 30%, 85% 10%, 73% 39%,
        100% 50%, 73% 61%, 85% 90%, 61% 73%,
        50% 100%, 39% 73%, 15% 90%, 27% 61%,
        0% 50%, 27% 39%, 15% 10%, 39% 30%
      );
      animation: sparkPop 260ms ease-out forwards;
    }

    /* 공격 2의 타격 효과는 주황색 */
    .hitSpark.punchSpark {
      background: #ffc16b;
    }

    @keyframes sparkPop {
      0% {
        opacity: 1;
        transform: translate(-50%, 50%) scale(0.3)
                   rotate(-15deg);
      }

      45% {
        opacity: 1;
        transform: translate(-50%, 50%) scale(1.2)
                   rotate(10deg);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, 50%) scale(1.5)
                   rotate(25deg);
      }
    }

    .damageNumber {
      position: absolute;
      color: #ffcf42;
      font-size: 32px;
      font-weight: 900;
      text-shadow:
        -2px -2px 0 #773d22,
        2px -2px 0 #773d22,
        -2px 2px 0 #773d22,
        2px 2px 0 #773d22;
      animation: damageFloat 650ms ease-out forwards;
    }

    @keyframes damageFloat {
      0% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(0.7);
      }

      25% {
        opacity: 1;
        transform: translateX(-50%) translateY(-18px) scale(1.2);
      }

      100% {
        opacity: 0;
        transform: translateX(-50%) translateY(-60px) scale(1);
      }
    }

    #controls {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      max-width: 900px;
      margin: 16px auto 0;
    }

    .buttonGroup {
      display: flex;
      gap: 8px;
    }

    .controlButton {
      width: 64px;
      height: 64px;
      padding: 0;
      border: none;
      border-bottom: 5px solid #537ba7;
      border-radius: 15px;
      background: #80b5ee;
      color: #172b45;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .controlButton:active {
      transform: translateY(3px);
      border-bottom-width: 2px;
    }

    #attackOneButton {
      border-bottom-color: #c28331;
      background: #ffd078;
    }

    #attackTwoButton {
      border-bottom-color: #c2673d;
      background: #ffa878;
    }

    #help {
      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 420px) {
      body {
        padding: 8px;
      }

      .controlButton {
        width: 50px;
        height: 60px;
        font-size: 15px;
      }

      .buttonGroup {
        gap: 4px;
      }

      #controls {
        gap: 4px;
      }
    }
  </style>
</head>

<body>
  <h1>🌱 우리의 성장 게임</h1>

  <div id="game">
    <div id="status">
      레벨 <span id="level">1</span><br>
      경험치 <span id="experience">0</span>/10
    </div>

    <div id="message">두 가지 공격을 사용해 보자!</div>

    <div id="ground"></div>

    <div id="hero">
      <img
        id="heroIdle"
        class="heroImage"
        src="hero.png"
        alt="우리의 주인공"
      >

      <img
        id="heroPunch"
        class="heroImage"
        src="hero-attack2.png"
        alt="주먹을 지르는 주인공"
        aria-hidden="true"
      >
    </div>

    <div id="slime">
      <div id="slimeBody"></div>
    </div>

    <div id="slimeHealth">
      <div id="slimeHealthFill"></div>
    </div>

    <div id="effects"></div>
  </div>

  <div id="controls">
    <div class="buttonGroup">
      <button
        id="leftButton"
        class="controlButton"
        aria-label="왼쪽 이동"
      >◀</button>

      <button
        id="rightButton"
        class="controlButton"
        aria-label="오른쪽 이동"
      >▶</button>
    </div>

    <div class="buttonGroup">
      <button
        id="attackOneButton"
        class="controlButton"
      >공격 1</button>

      <button
        id="attackTwoButton"
        class="controlButton"
      >공격 2</button>

      <button
        id="jumpButton"
        class="controlButton"
      >점프</button>
    </div>
  </div>

  <p id="help">
    방향키: 이동 · 스페이스바: 점프<br>
    Z키: 공격 1 · X키: 공격 2<br>
    휴대폰에서는 화면 버튼을 눌러 줘!
  </p>

  <script>
    const game = document.getElementById("game");
    const hero = document.getElementById("hero");
    const heroIdle = document.getElementById("heroIdle");
    const heroPunch = document.getElementById("heroPunch");
    const slime = document.getElementById("slime");
    const slimeBody = document.getElementById("slimeBody");
    const slimeHealth = document.getElementById("slimeHealth");
    const slimeHealthFill =
      document.getElementById("slimeHealthFill");
    const effects = document.getElementById("effects");
    const message = document.getElementById("message");

    // 주인공의 움직임
    const heroWidth = 90;
    const moveSpeed = 250;
    const jumpPower = 620;
    const gravity = 1700;

    let heroX = 30;
    let heroY = 0;
    let verticalSpeed = 0;

    // 1은 오른쪽, -1은 왼쪽
    let direction = 1;

    // 키보드와 멀티터치 입력을 따로 기억
    const keys = new Set();
    const leftTouches = new Set();
    const rightTouches = new Set();

    // 슬라임의 상태
    const slimeWidth = 68;
    const slimeHeight = 54;
    const slimeMaxHealth = 3;

    let slimeX = 0;
    let slimeHealthValue = slimeMaxHealth;
    let slimeAlive = true;
    let slimeReturnAt = 0;
    let slimeKnockback = 0;

    // 두 공격의 설정
    const attackSettings = {
      1: {
        duration: 280,
        cooldown: 380,
        impactDelay: 110,
        reach: 55,
        knockback: 30
      },

      2: {
        duration: 320,
        cooldown: 430,
        impactDelay: 115,
        reach: 55,
        knockback: 40
      }
    };

    let attackEndAt = 0;
    let nextAttackAt = 0;
    let pendingHitAt = null;
    let attackDirection = 1;
    let currentAttackType = 1;

    // 공격 그림이 제대로 불러와졌는지 확인
    let punchImageReady = false;

    function checkPunchImage() {
      punchImageReady =
        heroPunch.complete && heroPunch.naturalWidth > 0;
    }

    heroPunch.addEventListener("load", checkPunchImage);

    heroPunch.addEventListener("error", () => {
      punchImageReady = false;
      message.textContent =
        "공격 그림을 찾지 못했어. hero-attack2.png 이름을 확인해 줘!";
    });

    checkPunchImage();

    function jump() {
      if (heroY === 0) {
        verticalSpeed = jumpPower;
      }
    }

    // 같은 동작을 처음부터 다시 재생
    function restartAnimation(element, className) {
      element.classList.remove(className);
      void element.offsetWidth;
      element.classList.add(className);
    }

    function attack(type) {
      const now = performance.now();

      // 공격 사이에는 잠깐의 대기 시간이 필요
      if (now < nextAttackAt) {
        return;
      }

      if (type === 2 && !punchImageReady) {
        message.textContent =
          "공격 그림을 불러오는 중이야. 파일 이름도 확인해 줘!";
        return;
      }

      const settings = attackSettings[type];

      currentAttackType = type;
      attackDirection = direction;
      attackEndAt = now + settings.duration;
      nextAttackAt = now + settings.cooldown;
      pendingHitAt = now + settings.impactDelay;

      // 이전 공격 모습 정리
      hero.classList.remove("punching");
      heroIdle.classList.remove("attackOne");
      heroPunch.classList.remove("attackTwo");

      if (type === 1) {
        restartAnimation(heroIdle, "attackOne");
      } else {
        hero.classList.add("punching");
        restartAnimation(heroPunch, "attackTwo");
      }
    }

    // 타격 효과와 피해 숫자 만들기
    function showHitEffect(x, type) {
      const spark = document.createElement("div");

      spark.className = type === 2
        ? "hitSpark punchSpark"
        : "hitSpark";

      spark.style.left = `${x}px`;
      spark.style.bottom = "88px";
      effects.appendChild(spark);

      const damage = document.createElement("div");
      damage.className = "damageNumber";
      damage.textContent = "1";
      damage.style.left = `${x}px`;
      damage.style.bottom = "123px";
      effects.appendChild(damage);

      spark.addEventListener("animationend", () => {
        spark.remove();
      }, { once: true });

      damage.addEventListener("animationend", () => {
        damage.remove();
      }, { once: true });
    }

    // 밀려난 거리까지 포함한 슬라임의 표시 위치
    function getSlimeDrawX() {
      return Math.max(
        0,
        Math.min(
          game.clientWidth - slimeWidth,
          slimeX + slimeKnockback
        )
      );
    }

    function checkAttackHit(now) {
      if (!slimeAlive) {
        return;
      }

      const settings = attackSettings[currentAttackType];
      const targetX = getSlimeDrawX();

      // 주인공이 바라보는 쪽에만 공격 범위를 만듦
      const attackLeft = attackDirection === 1
        ? heroX + heroWidth / 2
        : heroX - settings.reach;

      const attackRight = attackDirection === 1
        ? heroX + heroWidth + settings.reach
        : heroX + heroWidth / 2;

      const horizontalHit =
        attackRight >= targetX &&
        attackLeft <= targetX + slimeWidth;

      // 너무 높이 점프하면 땅에 있는 슬라임을 때릴 수 없음
      const verticalHit = heroY + 28 <= slimeHeight;

      if (!horizontalHit || !verticalHit) {
        message.textContent =
          "휙! 슬라임 가까이에서 슬라임을 보고 공격해 봐!";
        return;
      }

      slimeHealthValue -= 1;

      showHitEffect(
        targetX + slimeWidth / 2,
        currentAttackType
      );

      // 공격한 방향으로 슬라임을 밀어냄
      slimeKnockback =
        attackDirection * settings.knockback;

      restartAnimation(slimeBody, "hit");

      if (slimeHealthValue <= 0) {
        slimeAlive = false;
        slimeReturnAt = now + 2000;

        message.textContent =
          "슬라임을 물리쳤다! 잠시 후 다시 나타나!";
      } else {
        message.textContent =
          `공격 ${currentAttackType} 명중! ` +
          `슬라임 체력 ${slimeHealthValue}/${slimeMaxHealth}`;
      }
    }

    heroIdle.addEventListener("animationend", () => {
      heroIdle.classList.remove("attackOne");
    });

    heroPunch.addEventListener("animationend", () => {
      heroPunch.classList.remove("attackTwo");
    });

    slimeBody.addEventListener("animationend", () => {
      slimeBody.classList.remove("hit");
    });

    // 키보드 조작
    const gameKeys = [
      "ArrowLeft",
      "ArrowRight",
      "Space",
      "KeyZ",
      "KeyX"
    ];

    window.addEventListener("keydown", (event) => {
      if (!gameKeys.includes(event.code)) {
        return;
      }

      event.preventDefault();
      keys.add(event.code);

      if (event.repeat) {
        return;
      }

      if (event.code === "Space") {
        jump();
      }

      if (event.code === "KeyZ") {
        attack(1);
      }

      if (event.code === "KeyX") {
        attack(2);
      }
    });

    window.addEventListener("keyup", (event) => {
      if (gameKeys.includes(event.code)) {
        event.preventDefault();
        keys.delete(event.code);
      }
    });

    // 이동 버튼은 손가락을 떼기 전까지 계속 이동
    function connectMoveButton(buttonId, touches) {
      const button = document.getElementById(buttonId);

      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        touches.add(event.pointerId);
      });

      function release(event) {
        touches.delete(event.pointerId);
      }

      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", release);
    }

    // 점프와 공격은 누르는 순간 한 번 실행
    function connectActionButton(buttonId, action) {
      const button = document.getElementById(buttonId);

      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        action();
      });

      // 키보드로 화면 버튼을 선택한 경우에도 실행
      button.addEventListener("click", (event) => {
        if (event.detail === 0) {
          action();
        }
      });
    }

    connectMoveButton("leftButton", leftTouches);
    connectMoveButton("rightButton", rightTouches);

    connectActionButton("jumpButton", jump);
    connectActionButton("attackOneButton", () => attack(1));
    connectActionButton("attackTwoButton", () => attack(2));

    // 다른 화면으로 이동하면 입력을 해제
    function clearInputs() {
      keys.clear();
      leftTouches.clear();
      rightTouches.clear();
    }

    window.addEventListener("blur", clearInputs);

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        clearInputs();

        // 화면을 떠난 뒤 늦게 공격이 맞는 현상을 방지
        pendingHitAt = null;
        attackEndAt = 0;

        hero.classList.remove("punching");
        heroIdle.classList.remove("attackOne");
        heroPunch.classList.remove("attackTwo");
      }
    });

    // 버튼을 길게 눌러도 메뉴가 뜨지 않게 함
    document.getElementById("controls")
      .addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });

    let previousTime = performance.now();

    function gameLoop(now) {
      // 기기 성능에 따라 이동 속도가 달라지지 않게 함
      const deltaTime = Math.min(
        (now - previousTime) / 1000,
        0.033
      );

      previousTime = now;

      const gameWidth = game.clientWidth;

      slimeX = Math.max(
        0,
        Math.min(gameWidth - slimeWidth, gameWidth * 0.75)
      );

      const attacking = now < attackEndAt;

      // 공격이 끝나면 원래 그림으로 복귀
      if (!attacking) {
        hero.classList.remove("punching");
      }

      const moveLeft =
        keys.has("ArrowLeft") || leftTouches.size > 0;

      const moveRight =
        keys.has("ArrowRight") || rightTouches.size > 0;

      // 공격 중에는 조금 천천히 이동
      const currentSpeed = attacking
        ? moveSpeed * 0.35
        : moveSpeed;

      if (moveLeft && !moveRight) {
        heroX -= currentSpeed * deltaTime;

        if (!attacking) {
          direction = -1;
        }
      }

      if (moveRight && !moveLeft) {
        heroX += currentSpeed * deltaTime;

        if (!attacking) {
          direction = 1;
        }
      }

      // 화면 밖으로 나가지 못하게 함
      heroX = Math.max(
        0,
        Math.min(gameWidth - heroWidth, heroX)
      );

      // 점프와 중력
      verticalSpeed -= gravity * deltaTime;
      heroY += verticalSpeed * deltaTime;

      if (heroY <= 0) {
        heroY = 0;
        verticalSpeed = 0;
      }

      // 밀려난 슬라임을 천천히 제자리로 되돌림
      slimeKnockback *= Math.exp(-10 * deltaTime);

      // 공격 동작 중 정해진 순간에 한 번만 타격 판정
      if (pendingHitAt !== null && now >= pendingHitAt) {
        pendingHitAt = null;
        checkAttackHit(now);
      }

      // 쓰러진 슬라임은 2초 후 다시 등장
      if (!slimeAlive && now >= slimeReturnAt) {
        slimeAlive = true;
        slimeHealthValue = slimeMaxHealth;
        slimeKnockback = 0;
        slimeBody.classList.remove("hit");

        message.textContent = "슬라임이 다시 나타났다!";
      }

      // 주인공의 위치와 방향 표시
      const drawDirection = attacking
        ? attackDirection
        : direction;

      hero.style.left = `${heroX}px`;
      hero.style.bottom = `${60 + heroY}px`;
      hero.style.transform = `scaleX(${drawDirection})`;

      // 슬라임과 체력 막대 표시
      const slimeDrawX = getSlimeDrawX();

      slime.style.left = `${slimeDrawX}px`;
      slimeHealth.style.left = `${slimeDrawX}px`;

      slime.style.display = slimeAlive ? "block" : "none";
      slimeHealth.style.display = slimeAlive ? "block" : "none";

      slimeHealthFill.style.width =
        `${slimeHealthValue / slimeMaxHealth * 100}%`;

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
