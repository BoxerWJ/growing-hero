<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>우리의 성장 게임</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background: #edf6ff;
      color: #243349;
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      margin: 8px 0 14px;
      font-size: 25px;
    }

    #game {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 390px;
      margin: 0 auto;
      overflow: hidden;
      border: 4px solid #34475e;
      border-radius: 16px;
      background: linear-gradient(#a9e2ff, #effbff);
    }

    #status {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 5;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
      text-align: left;
      font-weight: bold;
      line-height: 1.6;
    }

    #heroHealthBar {
      width: 130px;
      height: 12px;
      margin-top: 4px;
      overflow: hidden;
      border: 2px solid #b64655;
      border-radius: 8px;
      background: #ead4d7;
    }

    #heroHealthFill {
      width: 100%;
      height: 100%;
      background: #ff6576;
      transition: width 150ms ease;
    }

    #restartButton {
      margin-top: 8px;
      padding: 7px 12px;
      border: none;
      border-radius: 8px;
      background: #ffd078;
      color: #243349;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      position: absolute;
      top: 155px;
      left: 0;
      z-index: 5;
      width: 100%;
      padding: 0 12px;
      font-weight: bold;
      color: #36536e;
      pointer-events: none;
    }

    #ground {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 60px;
      border-top: 10px solid #75bc55;
      background: #b88755;
    }

    /* 주인공의 위치와 방향 */
    #hero {
      position: absolute;
      bottom: 60px;
      left: 0;
      width: 90px;
      height: 110px;
      z-index: 3;
      pointer-events: none;
    }

    .heroImage {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-origin: 50% 90%;
      user-select: none;
      -webkit-user-drag: none;
    }

    #heroPunch {
      visibility: hidden;
    }

    #hero.punching #heroIdle {
      visibility: hidden;
    }

    #hero.punching #heroPunch {
      visibility: visible;
    }

    /* 맞으면 잠깐 빨갛게 변함 */
    #hero.hurt .heroImage {
      filter: brightness(0.65) sepia(1)
              saturate(12) hue-rotate(-35deg);
    }

    /* 공격 1 */
    #heroIdle.attackOne {
      animation: heroAttackOne 280ms ease-out;
    }

    @keyframes heroAttackOne {
      0% {
        transform: translateX(0) rotate(0deg);
      }

      20% {
        transform: translateX(-8px) rotate(-10deg);
      }

      45% {
        transform: translateX(23px) rotate(15deg)
                   scale(1.07, 0.95);
      }

      65% {
        transform: translateX(17px) rotate(9deg);
      }

      100% {
        transform: translateX(0) rotate(0deg);
      }
    }

    /* 공격 2 */
    #heroPunch.attackTwo {
      animation: heroAttackTwo 320ms ease-out;
    }

    @keyframes heroAttackTwo {
      0% {
        transform: translateX(-6px) rotate(-4deg);
      }

      35% {
        transform: translateX(18px) rotate(3deg);
      }

      60% {
        transform: translateX(18px) rotate(3deg);
      }

      100% {
        transform: translateX(0) rotate(0deg);
      }
    }

    #slime {
      position: absolute;
      bottom: 60px;
      width: 68px;
      height: 54px;
      z-index: 2;
    }

    #slimeBody {
      position: relative;
      width: 100%;
      height: 100%;
      border: 3px solid #329343;
      border-radius: 50% 50% 35% 35%;
      background: #7be36b;
      transform-origin: center bottom;
      animation: squish 0.85s infinite alternate ease-in-out;
    }

    #slimeBody::before,
    #slimeBody::after {
      content: "";
      position: absolute;
      top: 20px;
      width: 7px;
      height: 10px;
      border-radius: 50%;
      background: #203329;
    }

    #slimeBody::before {
      left: 19px;
    }

    #slimeBody::after {
      right: 19px;
    }

    #slimeBody.hit {
      animation: slimeHit 260ms ease-out;
    }

    @keyframes slimeHit {
      0% {
        filter: brightness(4);
        transform: scale(1.3, 0.65);
      }

      40% {
        filter: brightness(2);
        transform: scale(0.85, 1.15);
      }

      100% {
        filter: brightness(1);
        transform: scale(1, 1);
      }
    }

    @keyframes squish {
      from {
        transform: scale(1.05, 0.92);
      }

      to {
        transform: scale(0.95, 1.08);
      }
    }

    #slimeHealth {
      position: absolute;
      bottom: 125px;
      width: 68px;
      height: 9px;
      overflow: hidden;
      border: 2px solid white;
      border-radius: 8px;
      background: #56616c;
    }

    #slimeHealthFill {
      width: 100%;
      height: 100%;
      background: #ff6576;
      transition: width 120ms ease;
    }

    #effects {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .hitSpark {
      position: absolute;
      width: 58px;
      height: 58px;
      background: #fff4a6;
      clip-path: polygon(
        50% 0%, 61% 30%, 85% 10%, 73% 39%,
        100% 50%, 73% 61%, 85% 90%, 61% 73%,
        50% 100%, 39% 73%, 15% 90%, 27% 61%,
        0% 50%, 27% 39%, 15% 10%, 39% 30%
      );
      animation: sparkPop 260ms ease-out forwards;
    }

    .hitSpark.punchSpark {
      background: #ffc16b;
    }

    @keyframes sparkPop {
      0% {
        opacity: 1;
        transform: translate(-50%, 50%) scale(0.3)
                   rotate(-15deg);
      }

      45% {
        opacity: 1;
        transform: translate(-50%, 50%) scale(1.2)
                   rotate(10deg);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, 50%) scale(1.5)
                   rotate(25deg);
      }
    }

    .damageNumber {
      position: absolute;
      color: #ffcf42;
      font-size: 32px;
      font-weight: 900;
      text-shadow:
        -2px -2px 0 #773d22,
        2px -2px 0 #773d22,
        -2px 2px 0 #773d22,
        2px 2px 0 #773d22;
      animation: damageFloat 650ms ease-out forwards;
    }

    .damageNumber.heroDamage {
      color: #ff5353;
      font-size: 28px;
      text-shadow:
        -1px -1px 0 white,
        1px -1px 0 white,
        -1px 1px 0 white,
        1px 1px 0 white;
    }

    @keyframes damageFloat {
      0% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(0.7);
      }

      25% {
        opacity: 1;
        transform: translateX(-50%) translateY(-18px) scale(1.2);
      }

      100% {
        opacity: 0;
        transform: translateX(-50%) translateY(-60px) scale(1);
      }
    }

    #controls {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      max-width: 900px;
      margin: 16px auto 0;
    }

    .buttonGroup {
      display: flex;
      gap: 8px;
    }

    .controlButton {
      width: 64px;
      height: 64px;
      padding: 0;
      border: none;
      border-bottom: 5px solid #537ba7;
      border-radius: 15px;
      background: #80b5ee;
      color: #172b45;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .controlButton:active {
      transform: translateY(3px);
      border-bottom-width: 2px;
    }

    #attackOneButton {
      border-bottom-color: #c28331;
      background: #ffd078;
    }

    #attackTwoButton {
      border-bottom-color: #c2673d;
      background: #ffa878;
    }

    #help {
      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 420px) {
      body {
        padding: 8px;
      }

      .controlButton {
        width: 50px;
        height: 60px;
        font-size: 15px;
      }

      .buttonGroup {
        gap: 4px;
      }

      #controls {
        gap: 4px;
      }
    }
  </style>
</head>

<body>
  <h1>🌱 우리의 성장 게임</h1>

  <div id="game">
    <div id="status">
      레벨 <span id="level">1</span><br>
      경험치 <span id="experience">0</span>/10<br>
      ❤️ 체력 <span id="heroHealthText">10</span>/10

      <div id="heroHealthBar">
        <div id="heroHealthFill"></div>
      </div>

      <button id="restartButton" hidden>다시 시작</button>
    </div>

    <div id="message">
      슬라임을 공격해 봐! 그냥 닿으면 체력이 줄어들어!
    </div>

    <div id="ground"></div>

    <div id="hero">
      <img
        id="heroIdle"
        class="heroImage"
        src="hero.png"
        alt="우리의 주인공"
      >

      <img
        id="heroPunch"
        class="heroImage"
        src="hero-attack2.png"
        alt="주먹을 지르는 주인공"
        aria-hidden="true"
      >
    </div>

    <div id="slime">
      <div id="slimeBody"></div>
    </div>

    <div id="slimeHealth">
      <div id="slimeHealthFill"></div>
    </div>

    <div id="effects"></div>
  </div>

  <div id="controls">
    <div class="buttonGroup">
      <button
        id="leftButton"
        class="controlButton"
        aria-label="왼쪽 이동"
      >◀</button>

      <button
        id="rightButton"
        class="controlButton"
        aria-label="오른쪽 이동"
      >▶</button>
    </div>

    <div class="buttonGroup">
      <button
        id="attackOneButton"
        class="controlButton"
      >공격 1</button>

      <button
        id="attackTwoButton"
        class="controlButton"
      >공격 2</button>

      <button
        id="jumpButton"
        class="controlButton"
      >점프</button>
    </div>
  </div>

  <p id="help">
    방향키: 이동 · 스페이스바: 점프<br>
    Z키: 공격 1 · X키: 공격 2<br>
    휴대폰에서는 화면 버튼을 눌러 줘!
  </p>

  <script>
    const game = document.getElementById("game");
    const hero = document.getElementById("hero");
    const heroIdle = document.getElementById("heroIdle");
    const heroPunch = document.getElementById("heroPunch");
    const heroHealthText =
      document.getElementById("heroHealthText");
    const heroHealthFill =
      document.getElementById("heroHealthFill");
    const restartButton =
      document.getElementById("restartButton");
    const slime = document.getElementById("slime");
    const slimeBody = document.getElementById("slimeBody");
    const slimeHealth = document.getElementById("slimeHealth");
    const slimeHealthFill =
      document.getElementById("slimeHealthFill");
    const effects = document.getElementById("effects");
    const message = document.getElementById("message");

    // 주인공의 움직임
    const heroWidth = 90;
    const moveSpeed = 250;
    const jumpPower = 620;
    const gravity = 1700;

    let heroX = 30;
    let heroY = 0;
    let verticalSpeed = 0;

    // 1은 오른쪽, -1은 왼쪽
    let direction = 1;

    // 주인공 체력
    const heroMaxHealth = 10;
    let heroHealthValue = heroMaxHealth;

    // 빨갛게 표시하는 시간과 추가 피해를 막는 시간
    let heroHurtUntil = 0;
    let heroInvincibleUntil = 0;

    // 키보드와 멀티터치 입력
    const keys = new Set();
    const leftTouches = new Set();
    const rightTouches = new Set();

    // 슬라임 상태
    const slimeWidth = 68;
    const slimeHeight = 54;
    const slimeMaxHealth = 3;

    let slimeX = 0;
    let slimeHealthValue = slimeMaxHealth;
    let slimeAlive = true;
    let slimeReturnAt = 0;
    let slimeKnockback = 0;

    // 두 공격의 설정
    const attackSettings = {
      1: {
        duration: 280,
        cooldown: 380,
        impactDelay: 110,
        reach: 55,
        knockback: 30
      },

      2: {
        duration: 320,
        cooldown: 430,
        impactDelay: 115,
        reach: 55,
        knockback: 40
      }
    };

    let attackEndAt = 0;
    let nextAttackAt = 0;
    let pendingHitAt = null;
    let attackDirection = 1;
    let currentAttackType = 1;

    // 공격 2 그림 확인
    let punchImageReady = false;

    function checkPunchImage() {
      punchImageReady =
        heroPunch.complete && heroPunch.naturalWidth > 0;
    }

    heroPunch.addEventListener("load", checkPunchImage);

    heroPunch.addEventListener("error", () => {
      punchImageReady = false;

      if (heroHealthValue > 0) {
        message.textContent =
          "공격 그림을 찾지 못했어. hero-attack2.png 이름을 확인해 줘!";
      }
    });

    checkPunchImage();

    function clearInputs() {
      keys.clear();
      leftTouches.clear();
      rightTouches.clear();
    }

    function clearAttack() {
      pendingHitAt = null;
      attackEndAt = 0;
      hero.classList.remove("punching");
      heroIdle.classList.remove("attackOne");
      heroPunch.classList.remove("attackTwo");
    }

    function updateHeroHealth() {
      heroHealthText.textContent = heroHealthValue;
      heroHealthFill.style.width =
        `${heroHealthValue / heroMaxHealth * 100}%`;
    }

    function jump() {
      if (heroHealthValue <= 0) {
        return;
      }

      if (heroY === 0) {
        verticalSpeed = jumpPower;
      }
    }

    // 같은 동작을 처음부터 다시 재생
    function restartAnimation(element, className) {
      element.classList.remove(className);
      void element.offsetWidth;
      element.classList.add(className);
    }

    function attack(type) {
      if (heroHealthValue <= 0) {
        return;
      }

      const now = performance.now();

      if (now < nextAttackAt) {
        return;
      }

      if (type === 2 && !punchImageReady) {
        message.textContent =
          "공격 그림을 불러오는 중이야. 파일 이름도 확인해 줘!";
        return;
      }

      const settings = attackSettings[type];

      currentAttackType = type;
      attackDirection = direction;
      attackEndAt = now + settings.duration;
      nextAttackAt = now + settings.cooldown;
      pendingHitAt = now + settings.impactDelay;

      hero.classList.remove("punching");
      heroIdle.classList.remove("attackOne");
      heroPunch.classList.remove("attackTwo");

      if (type === 1) {
        restartAnimation(heroIdle, "attackOne");
      } else {
        hero.classList.add("punching");
        restartAnimation(heroPunch, "attackTwo");
      }
    }

    // ダメージ数字
    function showDamageNumber(x, bottom, text, isHero) {
      const damage = document.createElement("div");

      damage.className = isHero
        ? "damageNumber heroDamage"
        : "damageNumber";

      damage.textContent = text;
      damage.style.left = `${x}px`;
      damage.style.bottom = `${bottom}px`;
      effects.appendChild(damage);

      damage.addEventListener("animationend", () => {
        damage.remove();
      }, { once: true });
    }

    // 슬라임 타격 효과
    function showHitEffect(x, type) {
      const spark = document.createElement("div");

      spark.className = type === 2
        ? "hitSpark punchSpark"
        : "hitSpark";

      spark.style.left = `${x}px`;
      spark.style.bottom = "88px";
      effects.appendChild(spark);

      showDamageNumber(x, 123, "1", false);

      spark.addEventListener("animationend", () => {
        spark.remove();
      }, { once: true });
    }

    // 밀려난 거리를 포함한 슬라임 위치
    function getSlimeDrawX() {
      return Math.max(
        0,
        Math.min(
          game.clientWidth - slimeWidth,
          slimeX + slimeKnockback
        )
      );
    }

    // 공격이 슬라임에 맞았는지 확인
    function checkAttackHit(now) {
      if (!slimeAlive || heroHealthValue <= 0) {
        return;
      }

      const settings = attackSettings[currentAttackType];
      const targetX = getSlimeDrawX();

      const attackLeft = attackDirection === 1
        ? heroX + heroWidth / 2
        : heroX - settings.reach;

      const attackRight = attackDirection === 1
        ? heroX + heroWidth + settings.reach
        : heroX + heroWidth / 2;

      const horizontalHit =
        attackRight >= targetX &&
        attackLeft <= targetX + slimeWidth;

      const verticalHit = heroY + 28 <= slimeHeight;

      if (!horizontalHit || !verticalHit) {
        message.textContent =
          "휙! 슬라임 가까이에서 슬라임을 보고 공격해 봐!";
        return;
      }

      slimeHealthValue = Math.max(0, slimeHealthValue - 1);

      showHitEffect(
        targetX + slimeWidth / 2,
        currentAttackType
      );

      slimeKnockback =
        attackDirection * settings.knockback;

      restartAnimation(slimeBody, "hit");

      if (slimeHealthValue === 0) {
        slimeAlive = false;
        slimeReturnAt = now + 2000;

        message.textContent =
          "슬라임을 물리쳤다! 잠시 후 다시 나타나!";
      } else {
        message.textContent =
          `공격 ${currentAttackType} 명중! ` +
          `슬라임 체력 ${slimeHealthValue}/${slimeMaxHealth}`;
      }
    }

    // 공격하지 않고 슬라임에 닿으면 주인공 피해
    function checkHeroContact(now) {
      if (
        !slimeAlive ||
        heroHealthValue <= 0 ||
        now < heroInvincibleUntil
      ) {
        return;
      }

      // 공격 동작 중에는 접촉 피해 없음
      if (now < attackEndAt) {
        return;
      }

      const targetX = getSlimeDrawX();

      // 캐릭터 그림의 빈 여백을 제외한 몸통 영역
      const heroLeft = heroX + 22;
      const heroRight = heroX + heroWidth - 22;
      const heroBottom = heroY + 8;
      const heroTop = heroY + 100;

      const touching =
        heroRight > targetX + 6 &&
        heroLeft < targetX + slimeWidth - 6 &&
        heroBottom < slimeHeight &&
        heroTop > 0;

      if (!touching) {
        return;
      }

      heroHealthValue = Math.max(0, heroHealthValue - 1);

      // 0.25초 동안 빨갛게 표시
      heroHurtUntil = now + 250;

      // 맞은 뒤 1초 동안 추가 피해 방지
      heroInvincibleUntil = now + 1000;

      updateHeroHealth();

      showDamageNumber(
        heroX + heroWidth / 2,
        60 + heroY + 90,
        "-1",
        true
      );

      if (heroHealthValue === 0) {
        clearInputs();
        clearAttack();

        restartButton.hidden = false;
        message.textContent =
          "체력이 다 떨어졌어! 다시 시작을 눌러 줘.";
      } else {
        message.textContent =
          `앗! 슬라임에 닿았어! ` +
          `체력 ${heroHealthValue}/${heroMaxHealth}`;
      }
    }

    // 새로고침 없이 다시 시작
    function restartGame() {
      clearInputs();
      clearAttack();

      heroX = 30;
      heroY = 0;
      verticalSpeed = 0;
      direction = 1;

      heroHealthValue = heroMaxHealth;
      heroHurtUntil = 0;
      heroInvincibleUntil = 0;
      hero.classList.remove("hurt");
      updateHeroHealth();

      nextAttackAt = 0;
      attackDirection = 1;
      currentAttackType = 1;

      slimeHealthValue = slimeMaxHealth;
      slimeAlive = true;
      slimeReturnAt = 0;
      slimeKnockback = 0;
      slimeBody.classList.remove("hit");

      effects.replaceChildren();
      restartButton.hidden = true;

      message.textContent =
        "다시 시작! 슬라임을 보고 공격해 봐!";
    }

    restartButton.addEventListener("click", restartGame);

    heroIdle.addEventListener("animationend", () => {
      heroIdle.classList.remove("attackOne");
    });

    heroPunch.addEventListener("animationend", () => {
      heroPunch.classList.remove("attackTwo");
    });

    slimeBody.addEventListener("animationend", () => {
      slimeBody.classList.remove("hit");
    });

    // 키보드 조작
    const gameKeys = [
      "ArrowLeft",
      "ArrowRight",
      "Space",
      "KeyZ",
      "KeyX"
    ];

    window.addEventListener("keydown", (event) => {
      if (!gameKeys.includes(event.code)) {
        return;
      }

      // 다시 시작 버튼의 키보드 조작 허용
      if (event.target === restartButton) {
        return;
      }

      event.preventDefault();

      if (heroHealthValue <= 0) {
        return;
      }

      keys.add(event.code);

      if (event.repeat) {
        return;
      }

      if (event.code === "Space") {
        jump();
      }

      if (event.code === "KeyZ") {
        attack(1);
      }

      if (event.code === "KeyX") {
        attack(2);
      }
    });

    window.addEventListener("keyup", (event) => {
      if (gameKeys.includes(event.code)) {
        keys.delete(event.code);

        if (event.target !== restartButton) {
          event.preventDefault();
        }
      }
    });

    // 이동 버튼은 누르고 있는 동안 이동
    function connectMoveButton(buttonId, touches) {
      const button = document.getElementById(buttonId);

      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();

        if (heroHealthValue <= 0) {
          return;
        }

        button.setPointerCapture(event.pointerId);
        touches.add(event.pointerId);
      });

      function release(event) {
        touches.delete(event.pointerId);
      }

      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", release);
    }

    // 점프와 공격은 누르는 순간 한 번 실행
    function connectActionButton(buttonId, action) {
      const button = document.getElementById(buttonId);

      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        action();
      });

      button.addEventListener("click", (event) => {
        if (event.detail === 0) {
          action();
        }
      });
    }

    connectMoveButton("leftButton", leftTouches);
    connectMoveButton("rightButton", rightTouches);

    connectActionButton("jumpButton", jump);
    connectActionButton("attackOneButton", () => attack(1));
    connectActionButton("attackTwoButton", () => attack(2));

    window.addEventListener("blur", () => {
      clearInputs();
      clearAttack();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        clearInputs();
        clearAttack();
      }
    });

    document.getElementById("controls")
      .addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });

    let previousTime = performance.now();

    function gameLoop(now) {
      const deltaTime = Math.min(
        (now - previousTime) / 1000,
        0.033
      );

      previousTime = now;

      if (document.hidden) {
        requestAnimationFrame(gameLoop);
        return;
      }

      const gameWidth = game.clientWidth;

      slimeX = Math.max(
        0,
        Math.min(gameWidth - slimeWidth, gameWidth * 0.75)
      );

      const attacking = now < attackEndAt;

      if (!attacking) {
        hero.classList.remove("punching");
      }

      const moveLeft =
        keys.has("ArrowLeft") || leftTouches.size > 0;

      const moveRight =
        keys.has("ArrowRight") || rightTouches.size > 0;

      const currentSpeed = heroHealthValue <= 0
        ? 0
        : attacking
          ? moveSpeed * 0.35
          : moveSpeed;

      if (moveLeft && !moveRight) {
        heroX -= currentSpeed * deltaTime;

        if (!attacking && heroHealthValue > 0) {
          direction = -1;
        }
      }

      if (moveRight && !moveLeft) {
        heroX += currentSpeed * deltaTime;

        if (!attacking && heroHealthValue > 0) {
          direction = 1;
        }
      }

      heroX = Math.max(
        0,
        Math.min(gameWidth - heroWidth, heroX)
      );

      // 점프와 중력
      verticalSpeed -= gravity * deltaTime;
      heroY += verticalSpeed * deltaTime;

      if (heroY <= 0) {
        heroY = 0;
        verticalSpeed = 0;
      }

      // 슬라임을 천천히 원래 위치로 되돌림
      slimeKnockback *= Math.exp(-10 * deltaTime);

      // 공격 한 번에 타격 판정 한 번
      if (pendingHitAt !== null && now >= pendingHitAt) {
        pendingHitAt = null;
        checkAttackHit(now);
      }

      // 슬라임은 쓰러진 뒤 2초 후 다시 등장
      if (
        !slimeAlive &&
        now >= slimeReturnAt &&
        heroHealthValue > 0
      ) {
        slimeAlive = true;
        slimeHealthValue = slimeMaxHealth;
        slimeKnockback = 0;
        slimeBody.classList.remove("hit");

        message.textContent = "슬라임이 다시 나타났다!";
      }

      // 접촉 피해와 피격 모습
      checkHeroContact(now);
      hero.classList.toggle("hurt", now < heroHurtUntil);

      // 주인공 표시
      const drawDirection = now < attackEndAt
        ? attackDirection
        : direction;

      hero.style.left = `${heroX}px`;
      hero.style.bottom = `${60 + heroY}px`;
      hero.style.transform = `scaleX(${drawDirection})`;

      // 슬라임과 체력 막대 표시
      const slimeDrawX = getSlimeDrawX();

      slime.style.left = `${slimeDrawX}px`;
      slimeHealth.style.left = `${slimeDrawX}px`;

      slime.style.display = slimeAlive ? "block" : "none";
      slimeHealth.style.display = slimeAlive ? "block" : "none";

      slimeHealthFill.style.width =
        `${slimeHealthValue / slimeMaxHealth * 100}%`;

      requestAnimationFrame(gameLoop);
    }

    updateHeroHealth();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
