<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>우리의 성장 게임</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #edf6ff;
      color: #243349;
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      margin: 8px 0 14px;
      font-size: 25px;
    }

    #game {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 390px;
      margin: 0 auto;
      overflow: hidden;
      border: 4px solid #34475e;
      border-radius: 16px;
      background: linear-gradient(#a9e2ff, #effbff);
    }

    #status {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 5;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
      text-align: left;
      font-weight: bold;
      line-height: 1.6;
    }

    #message {
      position: absolute;
      top: 100px;
      left: 0;
      width: 100%;
      padding: 0 12px;
      font-weight: bold;
      color: #36536e;
    }

    #ground {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 60px;
      border-top: 10px solid #75bc55;
      background: #b88755;
    }

    #hero {
      position: absolute;
      bottom: 60px;
      left: 0;
      width: 90px;
      height: 110px;
      z-index: 2;
      object-fit: contain;
      transform-origin: center;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    #slime {
      position: absolute;
      bottom: 60px;
      left: 0;
      width: 68px;
      height: 54px;
      border: 3px solid #329343;
      border-radius: 50% 50% 35% 35%;
      background: #7be36b;
      transform-origin: center bottom;
      animation: squish 0.85s infinite alternate ease-in-out;
    }

    /* 슬라임의 두 눈 */
    #slime::before,
    #slime::after {
      content: "";
      position: absolute;
      top: 20px;
      width: 7px;
      height: 10px;
      border-radius: 50%;
      background: #203329;
    }

    #slime::before {
      left: 19px;
    }

    #slime::after {
      right: 19px;
    }

    /* 공격에 맞으면 잠깐 밝게 빛남 */
    #slime.hit {
      filter: brightness(1.7);
    }

    #slimeHealth {
      position: absolute;
      bottom: 125px;
      left: 0;
      width: 68px;
      height: 9px;
      overflow: hidden;
      border: 2px solid white;
      border-radius: 8px;
      background: #56616c;
    }

    #slimeHealthFill {
      width: 100%;
      height: 100%;
      background: #ff6576;
    }

    #fist {
      position: absolute;
      bottom: 100px;
      left: 0;
      z-index: 3;
      display: none;
      width: 44px;
      height: 44px;
      font-size: 36px;
      line-height: 44px;
      pointer-events: none;
    }

    #controls {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      max-width: 900px;
      margin: 16px auto 0;
    }

    .buttonGroup {
      display: flex;
      gap: 10px;
    }

    .controlButton {
      width: 68px;
      height: 64px;
      padding: 0;
      border: none;
      border-bottom: 5px solid #537ba7;
      border-radius: 15px;
      background: #80b5ee;
      color: #172b45;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;

      /* 손가락 여러 개로 동시에 조작할 수 있게 함 */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .controlButton:active {
      transform: translateY(3px);
      border-bottom-width: 2px;
    }

    #attackButton {
      border-bottom-color: #c28331;
      background: #ffd078;
    }

    #help {
      font-size: 14px;
      line-height: 1.7;
    }

    @keyframes squish {
      from {
        transform: scale(1.05, 0.92);
      }

      to {
        transform: scale(0.95, 1.08);
      }
    }

    @media (max-width: 420px) {
      body {
        padding: 8px;
      }

      .controlButton {
        width: 60px;
        height: 60px;
        font-size: 19px;
      }

      .buttonGroup {
        gap: 6px;
      }

      #controls {
        gap: 6px;
      }
    }
  </style>
</head>

<body>
  <h1>🌱 우리의 성장 게임</h1>

  <div id="game">
    <div id="status">
      레벨 <span id="level">1</span><br>
      경험치 <span id="experience">0</span>/10
    </div>

    <div id="message">슬라임 가까이에서 공격해 보자!</div>

    <div id="ground"></div>

    <img id="hero" src="hero.png" alt="우리의 주인공">

    <div id="slime"></div>

    <div id="slimeHealth">
      <div id="slimeHealthFill"></div>
    </div>

    <div id="fist">👊</div>
  </div>

  <div id="controls">
    <div class="buttonGroup">
      <button id="leftButton" class="controlButton"
              aria-label="왼쪽 이동">◀</button>
      <button id="rightButton" class="controlButton"
              aria-label="오른쪽 이동">▶</button>
    </div>

    <div class="buttonGroup">
      <button id="attackButton" class="controlButton">공격</button>
      <button id="jumpButton" class="controlButton">점프</button>
    </div>
  </div>

  <p id="help">
    컴퓨터: 방향키로 이동 · 스페이스바로 점프 · Z키로 공격<br>
    휴대폰: 이동 버튼을 누르면서 점프나 공격 버튼을 눌러 보자!
  </p>

  <script>
    const game = document.getElementById("game");
    const hero = document.getElementById("hero");
    const slime = document.getElementById("slime");
    const slimeHealth = document.getElementById("slimeHealth");
    const slimeHealthFill =
      document.getElementById("slimeHealthFill");
    const fist = document.getElementById("fist");
    const message = document.getElementById("message");

    // 주인공의 크기와 움직임
    const heroWidth = 90;
    const heroHeight = 110;
    const moveSpeed = 250;
    const jumpPower = 620;
    const gravity = 1700;

    let heroX = 30;
    let heroY = 0;
    let verticalSpeed = 0;

    // 1이면 오른쪽, -1이면 왼쪽을 바라봄
    let direction = 1;

    // 키보드와 화면 버튼의 입력을 따로 기억함
    const keys = new Set();
    const leftTouches = new Set();
    const rightTouches = new Set();

    // 슬라임의 상태
    const slimeWidth = 68;
    const slimeHeight = 54;
    const slimeMaxHealth = 3;

    let slimeX = 0;
    let slimeHealthValue = slimeMaxHealth;
    let slimeAlive = true;
    let slimeHitUntil = 0;
    let slimeReturnAt = 0;

    // 공격의 범위와 대기 시간
    const attackReach = 55;
    const attackDuration = 180;
    const attackCooldown = 380;

    let attackUntil = 0;
    let nextAttackAt = 0;

    // 점프는 바닥에 있을 때만 가능
    function jump() {
      if (heroY === 0) {
        verticalSpeed = jumpPower;
      }
    }

    function attack() {
      const now = performance.now();

      // 너무 빠르게 연속 공격하지 못하게 함
      if (now < nextAttackAt) {
        return;
      }

      attackUntil = now + attackDuration;
      nextAttackAt = now + attackCooldown;

      // 주인공이 바라보는 쪽에 공격 범위를 만듦
      const attackLeft = direction === 1
        ? heroX + heroWidth / 2
        : heroX - attackReach;

      const attackRight = direction === 1
        ? heroX + heroWidth + attackReach
        : heroX + heroWidth / 2;

      const horizontalHit =
        attackRight >= slimeX &&
        attackLeft <= slimeX + slimeWidth;

      // 너무 높이 점프해 있으면 땅의 슬라임을 때릴 수 없음
      const verticalHit =
        heroY + 28 <= slimeHeight &&
        heroY + heroHeight >= 0;

      if (slimeAlive && horizontalHit && verticalHit) {
        slimeHealthValue -= 1;
        slimeHitUntil = now + 160;

        if (slimeHealthValue <= 0) {
          slimeAlive = false;
          slimeReturnAt = now + 2000;
          message.textContent =
            "슬라임을 물리쳤다! 잠시 후 다시 나타나!";
        } else {
          message.textContent =
            `명중! 슬라임 체력 ${slimeHealthValue}/${slimeMaxHealth}`;
        }
      } else {
        message.textContent =
          "휙! 슬라임 가까이에서 슬라임을 보고 공격해 봐!";
      }
    }

    // 키보드 조작
    const gameKeys =
      ["ArrowLeft", "ArrowRight", "Space", "KeyZ"];

    window.addEventListener("keydown", (event) => {
      if (!gameKeys.includes(event.code)) {
        return;
      }

      event.preventDefault();
      keys.add(event.code);

      if (event.repeat) {
        return;
      }

      if (event.code === "Space") {
        jump();
      }

      if (event.code === "KeyZ") {
        attack();
      }
    });

    window.addEventListener("keyup", (event) => {
      if (gameKeys.includes(event.code)) {
        event.preventDefault();
        keys.delete(event.code);
      }
    });

    // 이동 버튼은 손가락을 떼기 전까지 계속 이동
    function connectMoveButton(buttonId, touches) {
      const button = document.getElementById(buttonId);

      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        touches.add(event.pointerId);
      });

      function release(event) {
        touches.delete(event.pointerId);
      }

      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", release);
    }

    // 점프와 공격은 버튼을 누를 때 한 번 실행
    function connectActionButton(buttonId, action) {
      const button = document.getElementById(buttonId);

      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        action();
      });

      // 키보드로 화면 버튼을 선택한 경우에도 실행
      button.addEventListener("click", (event) => {
        if (event.detail === 0) {
          action();
        }
      });
    }

    connectMoveButton("leftButton", leftTouches);
    connectMoveButton("rightButton", rightTouches);
    connectActionButton("jumpButton", jump);
    connectActionButton("attackButton", attack);

    // 화면을 벗어났다가 돌아올 때 이동이 계속되는 현상 방지
    function clearInputs() {
      keys.clear();
      leftTouches.clear();
      rightTouches.clear();
    }

    window.addEventListener("blur", clearInputs);

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        clearInputs();
      }
    });

    // 화면 버튼을 길게 눌러도 메뉴가 뜨지 않게 함
    document.getElementById("controls")
      .addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });

    let previousTime = performance.now();

    function gameLoop(now) {
      // 컴퓨터 속도에 따라 이동 속도가 달라지지 않게 함
      const deltaTime = Math.min((now - previousTime) / 1000, 0.033);
      previousTime = now;

      const gameWidth = game.clientWidth;

      slimeX = Math.max(
        0,
        Math.min(gameWidth - slimeWidth, gameWidth * 0.75)
      );

      const moveLeft =
        keys.has("ArrowLeft") || leftTouches.size > 0;

      const moveRight =
        keys.has("ArrowRight") || rightTouches.size > 0;

      if (moveLeft && !moveRight) {
        heroX -= moveSpeed * deltaTime;
        direction = -1;
      }

      if (moveRight && !moveLeft) {
        heroX += moveSpeed * deltaTime;
        direction = 1;
      }

      // 주인공이 화면 밖으로 나가지 못하게 함
      heroX = Math.max(
        0,
        Math.min(gameWidth - heroWidth, heroX)
      );

      // 점프와 중력
      verticalSpeed -= gravity * deltaTime;
      heroY += verticalSpeed * deltaTime;

      if (heroY <= 0) {
        heroY = 0;
        verticalSpeed = 0;
      }

      // 쓰러진 슬라임이 2초 후 다시 등장
      if (!slimeAlive && now >= slimeReturnAt) {
        slimeAlive = true;
        slimeHealthValue = slimeMaxHealth;
        message.textContent = "슬라임이 다시 나타났다!";
      }

      // 주인공 위치와 바라보는 방향 표시
      hero.style.left = `${heroX}px`;
      hero.style.bottom = `${60 + heroY}px`;
      hero.style.transform = `scaleX(${direction})`;

      // 슬라임과 체력 막대 표시
      slime.style.left = `${slimeX}px`;
      slimeHealth.style.left = `${slimeX}px`;

      slime.style.display = slimeAlive ? "block" : "none";
      slimeHealth.style.display = slimeAlive ? "block" : "none";

      slime.classList.toggle("hit", now < slimeHitUntil);

      slimeHealthFill.style.width =
        `${slimeHealthValue / slimeMaxHealth * 100}%`;

      // 공격 중에는 주인공 앞에 주먹 표시
      const attacking = now < attackUntil;

      fist.style.display = attacking ? "block" : "none";
      fist.style.left = direction === 1
        ? `${heroX + heroWidth - 8}px`
        : `${heroX - 36}px`;

      fist.style.bottom = `${60 + heroY + 30}px`;
      fist.style.transform = `scaleX(${direction})`;

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
