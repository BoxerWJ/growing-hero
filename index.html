<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>우리의 성장 게임</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background: #edf6ff;
      color: #243349;
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      margin: 8px 0 14px;
      font-size: 25px;
    }

    #game {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 390px;
      margin: 0 auto;
      overflow: hidden;
      border: 4px solid #34475e;
      border-radius: 16px;
      background: linear-gradient(#a9e2ff, #effbff);
    }

    #status {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 5;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
      text-align: left;
      font-weight: bold;
      line-height: 1.6;
    }

    #heroHealthBar {
      width: 130px;
      height: 12px;
      margin-top: 4px;
      overflow: hidden;
      border: 2px solid #b64655;
      border-radius: 8px;
      background: #ead4d7;
    }

    #heroHealthFill {
      width: 100%;
      height: 100%;
      background: #ff6576;
      transition: width 150ms ease;
    }

    #restartButton {
      margin-top: 8px;
      padding: 7px 12px;
      border: none;
      border-radius: 8px;
      background: #ffd078;
      color: #243349;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      position: absolute;
      top: 155px;
      left: 0;
      z-index: 5;
      width: 100%;
      padding: 0 12px;
      font-weight: bold;
      color: #36536e;
      pointer-events: none;
    }

    #ground {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 60px;
      border-top: 10px solid #75bc55;
      background: #b88755;
    }

    /* 위치와 방향을 담당하는 상자 */
    #hero {
      position: absolute;
      bottom: 60px;
      left: 0;
      width: 90px;
      height: 110px;
      z-index: 3;
      pointer-events: none;
    }

    .heroImage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      transform-origin: 50% 90%;
      user-select: none;
      -webkit-user-drag: none;
      visibility: hidden;
    }

    #heroIdle {
      visibility: visible;
    }

    #hero.punching #heroIdle {
      visibility: hidden;
    }

    #hero.punching #heroPunch {
      visibility: visible;
    }

    /* 피격 모습이 공격 모습보다 우선 */
    #hero.hurt #heroIdle,
    #hero.hurt #heroPunch {
      visibility: hidden;
    }

    #hero.hurt #heroHit {
      visibility: visible;
    }

    /* 피격 그림이 없으면 기본 그림을 대신 사용 */
    #hero.hurt.hitFallback #heroIdle {
      visibility: visible;
    }

    #hero.hurt.hitFallback #heroHit {
      visibility: hidden;
    }

    #hero.hurt .heroImage {
      filter: brightness(0.65) sepia(1)
              saturate(12) hue-rotate(-35deg);
    }

    /* 사망 그림은 가로로 넓게 표시 */
    #heroDead {
      inset: auto;
      left: 50%;
      bottom: 0;
      width: 150px;
      height: 100px;
      transform: translateX(-50%);
      object-fit: contain;
      object-position: center bottom;
    }

    #hero.dead .heroImage {
      visibility: hidden;
      filter: none;
    }

    #hero.dead #heroDead {
      visibility: visible;
    }

    #hero.dead.deadFallback #heroDead {
      visibility: hidden;
    }

    #hero.dead.deadFallback #heroIdle {
      visibility: visible;
      transform: translateY(15px) rotate(80deg);
      filter: grayscale(0.7);
    }

    #heroIdle.attackOne {
      animation: heroAttackOne 280ms ease-out;
    }

    @keyframes heroAttackOne {
      0%, 100% {
        transform: translateX(0) rotate(0deg);
      }
      20% {
        transform: translateX(-8px) rotate(-10deg);
      }
      45% {
        transform: translateX(23px) rotate(15deg)
                   scale(1.07, 0.95);
      }
      65% {
        transform: translateX(17px) rotate(9deg);
      }
    }

    #heroPunch.attackTwo {
      animation: heroAttackTwo 320ms ease-out;
    }

    @keyframes heroAttackTwo {
      0% {
        transform: translateX(-6px) rotate(-4deg);
      }
      35%, 60% {
        transform: translateX(18px) rotate(3deg);
      }
      100% {
        transform: translateX(0) rotate(0deg);
      }
    }

    #slime {
      position: absolute;
      bottom: 60px;
      width: 68px;
      height: 54px;
      z-index: 2;
    }

    #slimeBody {
      position: relative;
      width: 100%;
      height: 100%;
      border: 3px solid #329343;
      border-radius: 50% 50% 35% 35%;
      background: #7be36b;
      transform-origin: center bottom;
      animation: squish 0.85s infinite alternate ease-in-out;
    }

    #slimeBody::before,
    #slimeBody::after {
      content: "";
      position: absolute;
      top: 20px;
      width: 7px;
      height: 10px;
      border-radius: 50%;
      background: #203329;
    }

    #slimeBody::before {
      left: 19px;
    }

    #slimeBody::after {
      right: 19px;
    }

    #slimeBody.hit {
      animation: slimeHit 260ms ease-out;
    }

    @keyframes slimeHit {
      0% {
        filter: brightness(4);
        transform: scale(1.3, 0.65);
      }
      40% {
        filter: brightness(2);
        transform: scale(0.85, 1.15);
      }
      100% {
        filter: brightness(1);
        transform: scale(1, 1);
      }
    }

    @keyframes squish {
      from {
        transform: scale(1.05, 0.92);
      }
      to {
        transform: scale(0.95, 1.08);
      }
    }

    #slimeHealth {
      position: absolute;
      bottom: 125px;
      width: 68px;
      height: 9px;
      overflow: hidden;
      border: 2px solid white;
      border-radius: 8px;
      background: #56616c;
    }

    #slimeHealthFill {
      width: 100%;
      height: 100%;
      background: #ff6576;
      transition: width 120ms ease;
    }

    #effects {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .hitSpark {
      position: absolute;
      width: 58px;
      height: 58px;
      background: #fff4a6;
      clip-path: polygon(
        50% 0%, 61% 30%, 85% 10%, 73% 39%,
        100% 50%, 73% 61%, 85% 90%, 61% 73%,
        50% 100%, 39% 73%, 15% 90%, 27% 61%,
        0% 50%, 27% 39%, 15% 10%, 39% 30%
      );
      animation: sparkPop 260ms ease-out forwards;
    }

    .hitSpark.punchSpark {
      background: #ffc16b;
    }

    @keyframes sparkPop {
      0% {
        opacity: 1;
        transform: translate(-50%, 50%) scale(0.3)
                   rotate(-15deg);
      }
      45% {
        opacity: 1;
        transform: translate(-50%, 50%) scale(1.2)
                   rotate(10deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, 50%) scale(1.5)
                   rotate(25deg);
      }
    }

    .damageNumber {
      position: absolute;
      color: #ffcf42;
      font-size: 32px;
      font-weight: 900;
      text-shadow:
        -2px -2px 0 #773d22,
        2px -2px 0 #773d22,
        -2px 2px 0 #773d22,
        2px 2px 0 #773d22;
      animation: damageFloat 650ms ease-out forwards;
    }

    .damageNumber.heroDamage {
      color: #ff5353;
      font-size: 28px;
      text-shadow:
        -1px -1px 0 white,
        1px -1px 0 white,
        -1px 1px 0 white,
        1px 1px 0 white;
    }

    @keyframes damageFloat {
      0% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(0.7);
      }
      25% {
        opacity: 1;
        transform: translateX(-50%) translateY(-18px) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translateX(-50%) translateY(-60px) scale(1);
      }
    }

    #controls {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      max-width: 900px;
      margin: 16px auto 0;
    }

    .buttonGroup {
      display: flex;
      gap: 8px;
    }

    .controlButton {
      width: 64px;
      height: 64px;
      padding: 0;
      border: none;
      border-bottom: 5px solid #537ba7;
      border-radius: 15px;
      background: #80b5ee;
      color: #172b45;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .controlButton:active {
      transform: translateY(3px);
      border-bottom-width: 2px;
    }

    #attackOneButton {
      border-bottom-color: #c28331;
      background: #ffd078;
    }

    #attackTwoButton {
      border-bottom-color: #c2673d;
      background: #ffa878;
    }

    #help {
      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 420px) {
      body {
        padding: 8px;
      }
      .controlButton {
        width: 50px;
        height: 60px;
        font-size: 15px;
      }
      .buttonGroup,
      #controls {
        gap: 4px;
      }
    }
  </style>
</head>

<body>
  <h1>🌱 우리의 성장 게임</h1>

  <div id="game">
    <div id="status">
      레벨 <span id="level">1</span><br>
      경험치 <span id="experience">0</span>/10<br>
      ❤️ 체력 <span id="heroHealthText">10</span>/10

      <div id="heroHealthBar">
        <div id="heroHealthFill"></div>
      </div>

      <button id="restartButton" hidden>다시 시작</button>
    </div>

    <div id="message">
      슬라임을 공격해 봐! 그냥 닿으면 체력이 줄어들어!
    </div>

    <div id="ground"></div>

    <div id="hero">
      <img id="heroIdle" class="heroImage"
           src="hero.png" alt="우리의 주인공">

      <img id="heroPunch" class="heroImage"
           src="hero-attack2.png" alt=""
           aria-hidden="true">

      <img id="heroHit" class="heroImage"
           src="hero-hit.png" alt=""
           aria-hidden="true">

      <img id="heroDead" class="heroImage"
           src="hero-dead.png" alt=""
           aria-hidden="true">
    </div>

    <div id="slime">
      <div id="slimeBody"></div>
    </div>

    <div id="slimeHealth">
      <div id="slimeHealthFill"></div>
    </div>

    <div id="effects"></div>
  </div>

  <div id="controls">
    <div class="buttonGroup">
      <button id="leftButton" class="controlButton"
              aria-label="왼쪽 이동">◀</button>
      <button id="rightButton" class="controlButton"
              aria-label="오른쪽 이동">▶</button>
    </div>

    <div class="buttonGroup">
      <button id="attackOneButton"
              class="controlButton">공격 1</button>
      <button id="attackTwoButton"
              class="controlButton">공격 2</button>
      <button id="jumpButton"
              class="controlButton">점프</button>
    </div>
  </div>

  <p id="help">
    방향키: 이동 · 스페이스바: 점프<br>
    Z키: 공격 1 · X키: 공격 2<br>
    휴대폰에서는 화면 버튼을 눌러 줘!
  </p>

  <script>
    const get = (id) => document.getElementById(id);

    const game = get("game");
    const hero = get("hero");
    const heroIdle = get("heroIdle");
    const heroPunch = get("heroPunch");
    const heroHit = get("heroHit");
    const heroDead = get("heroDead");
    const heroHealthText = get("heroHealthText");
    const heroHealthFill = get("heroHealthFill");
    const restartButton = get("restartButton");
    const slime = get("slime");
    const slimeBody = get("slimeBody");
    const slimeHealth = get("slimeHealth");
    const slimeHealthFill = get("slimeHealthFill");
    const effects = get("effects");
    const message = get("message");

    // 주인공 설정
    const heroWidth = 90;
    const moveSpeed = 250;
    const jumpPower = 620;
    const gravity = 1700;
    const heroMaxHealth = 10;

    let heroX = 30;
    let heroY = 0;
    let verticalSpeed = 0;
    let direction = 1;
    let heroHealthValue = heroMaxHealth;
    let heroHurtUntil = 0;
    let heroInvincibleUntil = 0;

    const keys = new Set();
    const leftTouches = new Set();
    const rightTouches = new Set();

    // 슬라임 설정
    const slimeWidth = 68;
    const slimeHeight = 54;
    const slimeMaxHealth = 3;

    let slimeX = 0;
    let slimeHealthValue = slimeMaxHealth;
    let slimeAlive = true;
    let slimeReturnAt = 0;
    let slimeKnockback = 0;

    const attackSettings = {
      1: {
        duration: 280,
        cooldown: 380,
        impactDelay: 110,
        reach: 55,
        knockback: 30
      },
      2: {
        duration: 320,
        cooldown: 430,
        impactDelay: 115,
        reach: 55,
        knockback: 40
      }
    };

    let attackEndAt = 0;
    let nextAttackAt = 0;
    let pendingHitAt = null;
    let attackDirection = 1;
    let currentAttackType = 1;

    function imageReady(image) {
      return image.complete && image.naturalWidth > 0;
    }

    // 画像が読み込めない場合の代替表示
    function updateImageFallbacks() {
      hero.classList.toggle("hitFallback", !imageReady(heroHit));
      hero.classList.toggle("deadFallback", !imageReady(heroDead));
    }

    [heroHit, heroDead].forEach((image) => {
      image.addEventListener("load", updateImageFallbacks);
      image.addEventListener("error", updateImageFallbacks);
    });

    heroPunch.addEventListener("error", () => {
      if (heroHealthValue > 0) {
        message.textContent =
          "hero-attack2.png の名前を確認してね！";
      }
    });

    updateImageFallbacks();

    function clearInputs() {
      keys.clear();
      leftTouches.clear();
      rightTouches.clear();
    }

    function clearAttack() {
      pendingHitAt = null;
      attackEndAt = 0;
      hero.classList.remove("punching");
      heroIdle.classList.remove("attackOne");
      heroPunch.classList.remove("attackTwo");
    }

    function updateHeroHealth() {
      heroHealthText.textContent = heroHealthValue;
      heroHealthFill.style.width =
        `${heroHealthValue / heroMaxHealth * 100}%`;
    }

    function jump() {
      if (heroHealthValue <= 0) return;

      if (heroY === 0) {
        verticalSpeed = jumpPower;
      }
    }

    function restartAnimation(element, className) {
      element.classList.remove(className);
      void element.offsetWidth;
      element.classList.add(className);
    }

    function attack(type) {
      const now = performance.now();

      if (
        heroHealthValue <= 0 ||
        now < heroHurtUntil ||
        now < nextAttackAt
      ) {
        return;
      }

      if (type === 2 && !imageReady(heroPunch)) {
        message.textContent =
          "hero-attack2.png 파일 이름과 업로드를 확인해 줘!";
        return;
      }

      const settings = attackSettings[type];

      currentAttackType = type;
      attackDirection = direction;
      attackEndAt = now + settings.duration;
      nextAttackAt = now + settings.cooldown;
      pendingHitAt = now + settings.impactDelay;

      hero.classList.remove("punching");
      heroIdle.classList.remove("attackOne");
      heroPunch.classList.remove("attackTwo");

      if (type === 1) {
        restartAnimation(heroIdle, "attackOne");
      } else {
        hero.classList.add("punching");
        restartAnimation(heroPunch, "attackTwo");
      }
    }

    function showDamageNumber(x, bottom, text, isHero) {
      const damage = document.createElement("div");
      damage.className = isHero
        ? "damageNumber heroDamage"
        : "damageNumber";
      damage.textContent = text;
      damage.style.left = `${x}px`;
      damage.style.bottom = `${bottom}px`;
      effects.appendChild(damage);

      damage.addEventListener("animationend", () => {
        damage.remove();
      }, { once: true });
    }

    function showHitEffect(x, type) {
      const spark = document.createElement("div");
      spark.className = type === 2
        ? "hitSpark punchSpark"
        : "hitSpark";
      spark.style.left = `${x}px`;
      spark.style.bottom = "88px";
      effects.appendChild(spark);

      showDamageNumber(x, 123, "1", false);

      spark.addEventListener("animationend", () => {
        spark.remove();
      }, { once: true });
    }

    function getSlimeDrawX() {
      return Math.max(
        0,
        Math.min(
          game.clientWidth - slimeWidth,
          slimeX + slimeKnockback
        )
      );
    }

    function checkAttackHit(now) {
      if (!slimeAlive || heroHealthValue <= 0) return;

      const settings = attackSettings[currentAttackType];
      const targetX = getSlimeDrawX();

      const attackLeft = attackDirection === 1
        ? heroX + heroWidth / 2
        : heroX - settings.reach;

      const attackRight = attackDirection === 1
        ? heroX + heroWidth + settings.reach
        : heroX + heroWidth / 2;

      const horizontalHit =
        attackRight >= targetX &&
        attackLeft <= targetX + slimeWidth;

      const verticalHit = heroY + 28 <= slimeHeight;

      if (!horizontalHit || !verticalHit) {
        message.textContent =
          "휙! 가까이에서 슬라임을 보고 공격해 봐!";
        return;
      }

      slimeHealthValue = Math.max(0, slimeHealthValue - 1);
      showHitEffect(
        targetX + slimeWidth / 2,
        currentAttackType
      );

      slimeKnockback = attackDirection * settings.knockback;
      restartAnimation(slimeBody, "hit");

      if (slimeHealthValue === 0) {
        slimeAlive = false;
        slimeReturnAt = now + 2000;
        message.textContent =
          "슬라임을 물리쳤다! 잠시 후 다시 나타나!";
      } else {
        message.textContent =
          `공격 ${currentAttackType} 명중! ` +
          `슬라임 체력 ${slimeHealthValue}/${slimeMaxHealth}`;
      }
    }

    function checkHeroContact(now) {
      if (
        !slimeAlive ||
        heroHealthValue <= 0 ||
        now < heroInvincibleUntil ||
        now < attackEndAt
      ) {
        return;
      }

      const targetX = getSlimeDrawX();

      const touching =
        heroX + heroWidth - 22 > targetX + 6 &&
        heroX + 22 < targetX + slimeWidth - 6 &&
        heroY + 8 < slimeHeight;

      if (!touching) return;

      heroHealthValue = Math.max(0, heroHealthValue - 1);
      heroHurtUntil = now + 250;
      heroInvincibleUntil = now + 1000;

      clearAttack();
      updateHeroHealth();

      showDamageNumber(
        heroX + heroWidth / 2,
        60 + heroY + 90,
        "-1",
        true
      );

      if (heroHealthValue === 0) {
        clearInputs();
        heroHurtUntil = 0;
        hero.classList.remove("hurt");
        hero.classList.add("dead");

        // 가로로 긴 사망 그림이 화면 밖으로 잘리지 않게 함
        const center = Math.max(
          75,
          Math.min(game.clientWidth - 75, heroX + heroWidth / 2)
        );
        heroX = center - heroWidth / 2;

        restartButton.hidden = false;
        message.textContent =
          "쓰러졌어… 다시 시작을 눌러 도전해 보자!";
      } else {
        message.textContent =
          `앗! 슬라임에 닿았어! ` +
          `체력 ${heroHealthValue}/${heroMaxHealth}`;
      }
    }

    function restartGame() {
      clearInputs();
      clearAttack();

      heroX = 30;
      heroY = 0;
      verticalSpeed = 0;
      direction = 1;
      heroHealthValue = heroMaxHealth;
      heroHurtUntil = 0;
      heroInvincibleUntil = 0;

      hero.classList.remove("hurt", "dead");
      updateHeroHealth();

      nextAttackAt = 0;
      attackDirection = 1;
      currentAttackType = 1;

      slimeHealthValue = slimeMaxHealth;
      slimeAlive = true;
      slimeReturnAt = 0;
      slimeKnockback = 0;
      slimeBody.classList.remove("hit");

      effects.replaceChildren();
      restartButton.hidden = true;
      message.textContent =
        "다시 시작! 슬라임을 보고 공격해 봐!";
    }

    restartButton.addEventListener("click", restartGame);

    heroIdle.addEventListener("animationend", () => {
      heroIdle.classList.remove("attackOne");
    });

    heroPunch.addEventListener("animationend", () => {
      heroPunch.classList.remove("attackTwo");
    });

    slimeBody.addEventListener("animationend", () => {
      slimeBody.classList.remove("hit");
    });

    const gameKeys = [
      "ArrowLeft", "ArrowRight", "Space", "KeyZ", "KeyX"
    ];

    window.addEventListener("keydown", (event) => {
      if (!gameKeys.includes(event.code)) return;
      if (event.target === restartButton) return;

      event.preventDefault();

      if (heroHealthValue <= 0) return;

      keys.add(event.code);

      if (event.repeat) return;

      if (event.code === "Space") jump();
      if (event.code === "KeyZ") attack(1);
      if (event.code === "KeyX") attack(2);
    });

    window.addEventListener("keyup", (event) => {
      if (!gameKeys.includes(event.code)) return;

      keys.delete(event.code);

      if (event.target !== restartButton) {
        event.preventDefault();
      }
    });

    function connectMoveButton(buttonId, touches) {
      const button = get(buttonId);

      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        if (heroHealthValue <= 0) return;

        button.setPointerCapture(event.pointerId);
        touches.add(event.pointerId);
      });

      function release(event) {
        touches.delete(event.pointerId);
      }

      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", release);
    }

    function connectActionButton(buttonId, action) {
      const button = get(buttonId);

      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        action();
      });

      button.addEventListener("click", (event) => {
        if (event.detail === 0) action();
      });
    }

    connectMoveButton("leftButton", leftTouches);
    connectMoveButton("rightButton", rightTouches);
    connectActionButton("jumpButton", jump);
    connectActionButton("attackOneButton", () => attack(1));
    connectActionButton("attackTwoButton", () => attack(2));

    window.addEventListener("blur", () => {
      clearInputs();
      clearAttack();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        clearInputs();
        clearAttack();
      }
    });

    get("controls").addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    let previousTime = performance.now();

    function gameLoop(now) {
      const deltaTime = Math.min(
        (now - previousTime) / 1000,
        0.033
      );
      previousTime = now;

      if (document.hidden) {
        requestAnimationFrame(gameLoop);
        return;
      }

      const gameWidth = game.clientWidth;
      const alive = heroHealthValue > 0;

      slimeX = Math.max(
        0,
        Math.min(gameWidth - slimeWidth, gameWidth * 0.75)
      );

      const attacking = now < attackEndAt;
      const hurt = now < heroHurtUntil;

      if (!attacking) {
        hero.classList.remove("punching");
      }

      const moveLeft =
        keys.has("ArrowLeft") || leftTouches.size > 0;
      const moveRight =
        keys.has("ArrowRight") || rightTouches.size > 0;

      const currentSpeed = !alive || hurt
        ? 0
        : attacking
          ? moveSpeed * 0.35
          : moveSpeed;

      if (moveLeft && !moveRight) {
        heroX -= currentSpeed * deltaTime;
        if (alive && !attacking && !hurt) direction = -1;
      }

      if (moveRight && !moveLeft) {
        heroX += currentSpeed * deltaTime;
        if (alive && !attacking && !hurt) direction = 1;
      }

      // 사망 이미지는 더 넓으므로 별도 여백 확보
      const sideMargin = alive ? 0 : 30;
      heroX = Math.max(
        sideMargin,
        Math.min(gameWidth - heroWidth - sideMargin, heroX)
      );

      verticalSpeed -= gravity * deltaTime;
      heroY += verticalSpeed * deltaTime;

      if (heroY <= 0) {
        heroY = 0;
        verticalSpeed = 0;
      }

      slimeKnockback *= Math.exp(-10 * deltaTime);

      if (pendingHitAt !== null && now >= pendingHitAt) {
        pendingHitAt = null;
        checkAttackHit(now);
      }

      if (
        !slimeAlive &&
        now >= slimeReturnAt &&
        heroHealthValue > 0
      ) {
        slimeAlive = true;
        slimeHealthValue = slimeMaxHealth;
        slimeKnockback = 0;
        slimeBody.classList.remove("hit");
        message.textContent = "슬라임이 다시 나타났다!";
      }

      checkHeroContact(now);

      hero.classList.toggle(
        "hurt",
        heroHealthValue > 0 && now < heroHurtUntil
      );
      hero.classList.toggle("dead", heroHealthValue <= 0);

      const drawDirection = now < attackEndAt
        ? attackDirection
        : direction;

      hero.style.left = `${heroX}px`;
      hero.style.bottom = `${60 + heroY}px`;
      hero.style.transform = `scaleX(${drawDirection})`;

      const slimeDrawX = getSlimeDrawX();
      slime.style.left = `${slimeDrawX}px`;
      slimeHealth.style.left = `${slimeDrawX}px`;
      slime.style.display = slimeAlive ? "block" : "none";
      slimeHealth.style.display = slimeAlive ? "block" : "none";
      slimeHealthFill.style.width =
        `${slimeHealthValue / slimeMaxHealth * 100}%`;

      requestAnimationFrame(gameLoop);
    }

    updateHeroHealth();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
