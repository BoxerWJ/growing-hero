<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>우리의 성장 게임</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #edf6ff;
      color: #243349;
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      margin: 8px 0 14px;
      font-size: 25px;
    }

    #game {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 390px;
      margin: 0 auto;
      overflow: hidden;
      border: 4px solid #34475e;
      border-radius: 16px;
      background: linear-gradient(#a9e2ff, #effbff);
    }

    #status {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 5;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
      text-align: left;
      font-weight: bold;
      line-height: 1.6;
    }

    #message {
      position: absolute;
      top: 100px;
      left: 0;
      width: 100%;
      padding: 0 12px;
      font-weight: bold;
      color: #36536e;
    }

    #ground {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 60px;
      border-top: 10px solid #75bc55;
      background: #b88755;
    }

    /* 위치와 방향은 이 상자가 담당 */
    #hero {
      position: absolute;
      bottom: 60px;
      left: 0;
      width: 90px;
      height: 110px;
      z-index: 3;
      pointer-events: none;
    }

    /* 공격할 때 이미지 자체를 움직임 */
    #heroImage {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-origin: 50% 90%;
      user-select: none;
      -webkit-user-drag: none;
    }

    #heroImage.attacking {
      animation: heroAttack 280ms ease-out;
    }

    /* 살짝 뒤로 물러났다가 앞으로 몸을 내미는 공격 */
    @keyframes heroAttack {
      0% {
        transform: translateX(0) rotate(0deg);
      }

      20% {
        transform: translateX(-8px) rotate(-10deg);
      }

      45% {
        transform: translateX(23px) rotate(15deg)
                   scale(1.07, 0.95);
      }

      65% {
        transform: translateX(17px) rotate(9deg);
      }

      100% {
        transform: translateX(0) rotate(0deg);
      }
    }

    /* 슬라임의 위치와 밀려나는 움직임을 담당 */
    #slime {
      position: absolute;
      bottom: 60px;
      width: 68px;
      height: 54px;
      z-index: 2;
    }

    /* 평소 말랑거리는 모습 */
    #slimeBody {
      position: relative;
      width: 100%;
      height: 100%;
      border: 3px solid #329343;
      border-radius: 50% 50% 35% 35%;
      background: #7be36b;
      transform-origin: center bottom;
      animation: squish 0.85s infinite alternate ease-in-out;
    }

    #slimeBody::before,
    #slimeBody::after {
      content: "";
      position: absolute;
      top: 20px;
      width: 7px;
      height: 10px;
      border-radius: 50%;
      background: #203329;
    }

    #slimeBody::before {
      left: 19px;
    }

    #slimeBody::after {
      right: 19px;
    }

    /* 맞으면 밝게 번쩍이며 찌그러짐 */
    #slimeBody.hit {
      animation: slimeHit 260ms ease-out;
    }

    @keyframes slimeHit {
      0% {
        filter: brightness(4);
        transform: scale(1.3, 0.65);
      }

      40% {
        filter: brightness(2);
        transform: scale(0.85, 1.15);
      }

      100% {
        filter: brightness(1);
        transform: scale(1, 1);
      }
    }

    @keyframes squish {
      from {
        transform: scale(1.05, 0.92);
      }

      to {
        transform: scale(0.95, 1.08);
      }
    }

    #slimeHealth {
      position: absolute;
      bottom: 125px;
      width: 68px;
      height: 9px;
      overflow: hidden;
      border: 2px solid white;
      border-radius: 8px;
      background: #56616c;
    }

    #slimeHealthFill {
      width: 100%;
      height: 100%;
      background: #ff6576;
    }

    /* 타격 효과와 피해 숫자가 들어가는 공간 */
    #effects {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    /* 맞은 자리에 나타나는 별 모양 */
    .hitSpark {
      position: absolute;
      width: 58px;
      height: 58px;
      background: #fff4a6;
      clip-path: polygon(
        50% 0%, 61% 30%, 85% 10%, 73% 39%,
        100% 50%, 73% 61%, 85% 90%, 61% 73%,
        50% 100%, 39% 73%, 15% 90%, 27% 61%,
        0% 50%, 27% 39%, 15% 10%, 39% 30%
      );
      animation: sparkPop 260ms ease-out forwards;
    }

    @keyframes sparkPop {
      0% {
        opacity: 1;
        transform: translate(-50%, 50%) scale(0.3)
                   rotate(-15deg);
      }

      45% {
        opacity: 1;
        transform: translate(-50%, 50%) scale(1.2)
                   rotate(10deg);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, 50%) scale(1.5)
                   rotate(25deg);
      }
    }

    .damageNumber {
      position: absolute;
      color: #ffcf42;
      font-size: 32px;
      font-weight: 900;
      text-shadow:
        -2px -2px 0 #773d22,
        2px -2px 0 #773d22,
        -2px 2px 0 #773d22,
        2px 2px 0 #773d22;
      animation: damageFloat 650ms ease-out forwards;
    }

    @keyframes damageFloat {
      0% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(0.7);
      }

      25% {
        opacity: 1;
        transform: translateX(-50%) translateY(-18px) scale(1.2);
      }

      100% {
        opacity: 0;
        transform: translateX(-50%) translateY(-60px) scale(1);
      }
    }

    #controls {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      max-width: 900px;
      margin: 16px auto 0;
    }

    .buttonGroup {
      display: flex;
      gap: 10px;
    }

    .controlButton {
      width: 68px;
      height: 64px;
      padding: 0;
      border: none;
      border-bottom: 5px solid #537ba7;
      border-radius: 15px;
      background: #80b5ee;
      color: #172b45;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .controlButton:active {
      transform: translateY(3px);
      border-bottom-width: 2px;
    }

    #attackButton {
      border-bottom-color: #c28331;
      background: #ffd078;
    }

    #help {
      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 420px) {
      body {
        padding: 8px;
      }

      .controlButton {
        width: 60px;
        height: 60px;
        font-size: 19px;
      }

      .buttonGroup {
        gap: 6px;
      }

      #controls {
        gap: 6px;
      }
    }
  </style>
</head>

<body>
  <h1>🌱 우리의 성장 게임</h1>

  <div id="game">
    <div id="status">
      레벨 <span id="level">1</span><br>
      경험치 <span id="experience">0</span>/10
    </div>

    <div id="message">슬라임 가까이에서 공격해 보자!</div>

    <div id="ground"></div>

    <div id="hero">
      <img id="heroImage" src="hero.png" alt="우리의 주인공">
    </div>

    <div id="slime">
      <div id="slimeBody"></div>
    </div>

    <div id="slimeHealth">
      <div id="slimeHealthFill"></div>
    </div>

    <div id="effects"></div>
  </div>

  <div id="controls">
    <div class="buttonGroup">
      <button id="leftButton" class="controlButton"
              aria-label="왼쪽 이동">◀</button>
      <button id="rightButton" class="controlButton"
              aria-label="오른쪽 이동">▶</button>
    </div>

    <div class="buttonGroup">
      <button id="attackButton" class="controlButton">공격</button>
      <button id="jumpButton" class="controlButton">점프</button>
    </div>
  </div>

  <p id="help">
    컴퓨터: 방향키로 이동 · 스페이스바로 점프 · Z키로 공격<br>
    휴대폰: 이동하면서 점프와 공격을 해 보자!
  </p>

  <script>
    const game = document.getElementById("game");
    const hero = document.getElementById("hero");
    const heroImage = document.getElementById("heroImage");
    const slime = document.getElementById("slime");
    const slimeBody = document.getElementById("slimeBody");
    const slimeHealth = document.getElementById("slimeHealth");
    const slimeHealthFill =
      document.getElementById("slimeHealthFill");
    const effects = document.getElementById("effects");
    const message = document.getElementById("message");

    // 주인공의 움직임
    const heroWidth = 90;
    const moveSpeed = 250;
    const jumpPower = 620;
    const gravity = 1700;

    let heroX = 30;
    let heroY = 0;
    let verticalSpeed = 0;
    let direction = 1;

    // 키보드와 멀티터치 입력
    const keys = new Set();
    const leftTouches = new Set();
    const rightTouches = new Set();

    // 슬라임의 상태
    const slimeWidth = 68;
    const slimeHeight = 54;
    const slimeMaxHealth = 3;

    let slimeX = 0;
    let slimeHealthValue = slimeMaxHealth;
    let slimeAlive = true;
    let slimeReturnAt = 0;

    // 공격받았을 때 밀려나는 거리
    let slimeKnockback = 0;

    // 공격 준비 후 몸을 내미는 순간에 타격 판정
    const attackReach = 55;
    const attackDuration = 280;
    const attackCooldown = 380;
    const impactDelay = 110;

    let attackEndAt = 0;
    let nextAttackAt = 0;
    let pendingHitAt = null;
    let attackDirection = 1;

    function jump() {
      if (heroY === 0) {
        verticalSpeed = jumpPower;
      }
    }

    // 같은 효과를 다시 재생하는 함수
    function restartAnimation(element, className) {
      element.classList.remove(className);
      void element.offsetWidth;
      element.classList.add(className);
    }

    function attack() {
      const now = performance.now();

      if (now < nextAttackAt) {
        return;
      }

      attackDirection = direction;
      attackEndAt = now + attackDuration;
      nextAttackAt = now + attackCooldown;
      pendingHitAt = now + impactDelay;

      restartAnimation(heroImage, "attacking");
    }

    // 타격 효과와 피해 숫자 만들기
    function showHitEffect(x) {
      const spark = document.createElement("div");
      spark.className = "hitSpark";
      spark.style.left = `${x}px`;
      spark.style.bottom = "88px";
      effects.appendChild(spark);

      const damage = document.createElement("div");
      damage.className = "damageNumber";
      damage.textContent = "1";
      damage.style.left = `${x}px`;
      damage.style.bottom = "123px";
      effects.appendChild(damage);

      spark.addEventListener("animationend", () => {
        spark.remove();
      }, { once: true });

      damage.addEventListener("animationend", () => {
        damage.remove();
      }, { once: true });
    }

    function checkAttackHit(now) {
      if (!slimeAlive) {
        return;
      }

      const targetX = getSlimeDrawX();

      const attackLeft = attackDirection === 1
        ? heroX + heroWidth / 2
        : heroX - attackReach;

      const attackRight = attackDirection === 1
        ? heroX + heroWidth + attackReach
        : heroX + heroWidth / 2;

      const horizontalHit =
        attackRight >= targetX &&
        attackLeft <= targetX + slimeWidth;

      // 跳び上がりすぎていると地面の敵には当たらない
      const verticalHit = heroY + 28 <= slimeHeight;

      if (!horizontalHit || !verticalHit) {
        message.textContent =
          "空振り！ スライムの近くで攻撃してみよう！";
        return;
      }

      slimeHealthValue -= 1;

      showHitEffect(targetX + slimeWidth / 2);

      // 攻撃した方向へ押し出す
      slimeKnockback = attackDirection * 30;

      restartAnimation(slimeBody, "hit");

      if (slimeHealthValue <= 0) {
        slimeAlive = false;
        slimeReturnAt = now + 2000;
        message.textContent =
          "スライムを倒した！ 少しするとまた現れるよ！";
      } else {
        message.textContent =
          `命中！ スライムの体力 ${slimeHealthValue}/${slimeMaxHealth}`;
      }
    }

    // 押し出された分も含めたスライムの位置
    function getSlimeDrawX() {
      return Math.max(
        0,
        Math.min(
          game.clientWidth - slimeWidth,
          slimeX + slimeKnockback
        )
      );
    }

    heroImage.addEventListener("animationend", () => {
      heroImage.classList.remove("attacking");
    });

    slimeBody.addEventListener("animationend", () => {
      slimeBody.classList.remove("hit");
    });

    // キーボード操作
    const gameKeys =
      ["ArrowLeft", "ArrowRight", "Space", "KeyZ"];

    window.addEventListener("keydown", (event) => {
      if (!gameKeys.includes(event.code)) {
        return;
      }

      event.preventDefault();
      keys.add(event.code);

      if (event.repeat) {
        return;
      }

      if (event.code === "Space") {
        jump();
      }

      if (event.code === "KeyZ") {
        attack();
      }
    });

    window.addEventListener("keyup", (event) => {
      if (gameKeys.includes(event.code)) {
        event.preventDefault();
        keys.delete(event.code);
      }
    });

    // 移動ボタンは押している間だけ移動
    function connectMoveButton(buttonId, touches) {
      const button = document.getElementById(buttonId);

      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        touches.add(event.pointerId);
      });

      function release(event) {
        touches.delete(event.pointerId);
      }

      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", release);
    }

    // ジャンプと攻撃は押した瞬間に実行
    function connectActionButton(buttonId, action) {
      const button = document.getElementById(buttonId);

      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        action();
      });

      button.addEventListener("click", (event) => {
        if (event.detail === 0) {
          action();
        }
      });
    }

    connectMoveButton("leftButton", leftTouches);
    connectMoveButton("rightButton", rightTouches);
    connectActionButton("jumpButton", jump);
    connectActionButton("attackButton", attack);

    // 画面を離れたときに入力を解除
    function clearInputs() {
      keys.clear();
      leftTouches.clear();
      rightTouches.clear();
    }

    window.addEventListener("blur", clearInputs);

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        clearInputs();
      }
    });

    document.getElementById("controls")
      .addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });

    let previousTime = performance.now();

    function gameLoop(now) {
      const deltaTime =
        Math.min((now - previousTime) / 1000, 0.033);

      previousTime = now;

      const gameWidth = game.clientWidth;

      slimeX = Math.max(
        0,
        Math.min(gameWidth - slimeWidth, gameWidth * 0.75)
      );

      const attacking = now < attackEndAt;

      const moveLeft =
        keys.has("ArrowLeft") || leftTouches.size > 0;

      const moveRight =
        keys.has("ArrowRight") || rightTouches.size > 0;

      // 攻撃中は移動を少し遅くして踏み込む感じにする
      const currentSpeed = attacking
        ? moveSpeed * 0.35
        : moveSpeed;

      if (moveLeft && !moveRight) {
        heroX -= currentSpeed * deltaTime;

        if (!attacking) {
          direction = -1;
        }
      }

      if (moveRight && !moveLeft) {
        heroX += currentSpeed * deltaTime;

        if (!attacking) {
          direction = 1;
        }
      }

      heroX = Math.max(
        0,
        Math.min(gameWidth - heroWidth, heroX)
      );

      // ジャンプと重力
      verticalSpeed -= gravity * deltaTime;
      heroY += verticalSpeed * deltaTime;

      if (heroY <= 0) {
        heroY = 0;
        verticalSpeed = 0;
      }

      // 押し出されたスライムを徐々に元の位置へ戻す
      slimeKnockback *= Math.exp(-10 * deltaTime);

      // 攻撃動作の途中で一度だけ命中を判定
      if (pendingHitAt !== null && now >= pendingHitAt) {
        pendingHitAt = null;
        checkAttackHit(now);
      }

      // 倒されたスライムが再登場
      if (!slimeAlive && now >= slimeReturnAt) {
        slimeAlive = true;
        slimeHealthValue = slimeMaxHealth;
        slimeKnockback = 0;
        slimeBody.classList.remove("hit");

        message.textContent = "スライムがまた現れた！";
      }

      // 主人公の表示
      const drawDirection = attacking
        ? attackDirection
        : direction;

      hero.style.left = `${heroX}px`;
      hero.style.bottom = `${60 + heroY}px`;
      hero.style.transform = `scaleX(${drawDirection})`;

      // スライムと体力表示
      const slimeDrawX = getSlimeDrawX();

      slime.style.left = `${slimeDrawX}px`;
      slimeHealth.style.left = `${slimeDrawX}px`;

      slime.style.display = slimeAlive ? "block" : "none";
      slimeHealth.style.display = slimeAlive ? "block" : "none";

      slimeHealthFill.style.width =
        `${slimeHealthValue / slimeMaxHealth * 100}%`;

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
